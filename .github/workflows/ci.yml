name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    name: Revisiones y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Revisiones estaticas
        run: npm run check

      - name: Construir con los datos de demostracion
        run: npm run build:demo

      - name: Instalar el navegador de pruebas
        run: npx playwright install --with-deps chromium

      - name: Pruebas de extremo a extremo
        run: npm test

      - name: Guardar los PDF generados en las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-pdf
          path: tests/.artifacts/
          if-no-files-found: ignore
          retention-days: 7
