<title>Control de Portafolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="css">
:root{
  --ground:#F3F4F8; --surface:#FFFFFF; --surface-2:#F8F9FC; --surface-3:#EEF0F6;
  --line:#DCDFE9; --line-strong:#BFC5D6;
  --ink:#161926; --ink-2:#4A5165; --ink-3:#787F96;
  --accent:#3D5AAA; --accent-soft:#E6EBF8; --accent-ink:#2B4183; --on-accent:#FFFFFF; --bar-empty:rgba(255,255,255,.62);
  --ok:#1C7A4E; --ok-soft:#E2F1E9;
  --warn:#9E6B12; --warn-soft:#FAEEDA;
  --risk:#AF362F; --risk-soft:#FAE6E4;
  --neutral-soft:#E9EBF1;
  --shadow:0 1px 2px rgba(22,25,38,.06), 0 4px 14px rgba(22,25,38,.05);
  --r:10px; --r-sm:6px;
  --font-d:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-b:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
  --font-m:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1018; --surface:#171A25; --surface-2:#1D2130; --surface-3:#232838;
    --line:#2A2F41; --line-strong:#3C4358;
    --ink:#E9EBF3; --ink-2:#A9AFC4; --ink-3:#7B8299;
    --accent:#7C94E2; --accent-soft:#212840; --accent-ink:#A9BBF2; --on-accent:#0E1018; --bar-empty:rgba(10,12,20,.55);
    --ok:#54B384; --ok-soft:#16281F;
    --warn:#DCA646; --warn-soft:#2B2314;
    --risk:#E27C73; --risk-soft:#2E1A18;
    --neutral-soft:#242939;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1018; --surface:#171A25; --surface-2:#1D2130; --surface-3:#232838;
  --line:#2A2F41; --line-strong:#3C4358;
  --ink:#E9EBF3; --ink-2:#A9AFC4; --ink-3:#7B8299;
  --accent:#7C94E2; --accent-soft:#212840; --accent-ink:#A9BBF2; --on-accent:#0E1018; --bar-empty:rgba(10,12,20,.55);
  --ok:#54B384; --ok-soft:#16281F;
  --warn:#DCA646; --warn-soft:#2B2314;
  --risk:#E27C73; --risk-soft:#2E1A18;
  --neutral-soft:#242939;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
.ev{display:inline-flex;align-items:center;gap:5px;max-width:230px}
.ev svg{flex:none;opacity:.7}
.ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.num{font-family:var(--font-m);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- chrome ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1480px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:19px;font-weight:700}
.brand .sub{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.09em;font-family:var(--font-d);font-weight:500}
.tabs{max-width:1480px;margin:0 auto;padding:0 22px;display:flex;gap:2px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:11px 14px;font-family:var(--font-d);font-weight:500;font-size:14px;color:var(--ink-3);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
main{max-width:1480px;margin:0 auto;padding:24px 22px 80px}
.wrap{display:flex;flex-direction:column;gap:22px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:var(--r-sm);cursor:pointer;font-family:var(--font-d);font-weight:500;font-size:13.5px;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-3);border-color:var(--ink-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--on-accent)}
.btn-sm{padding:4px 9px;font-size:12.5px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-3)}
.btn-danger{color:var(--risk);border-color:var(--line-strong)}
.btn-danger:hover{background:var(--risk-soft);border-color:var(--risk)}
select,input[type=text],input[type=date],input[type=number],textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:6px 9px;font-size:14px;min-width:0}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-family:var(--font-d);font-weight:500;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
label.fld>*:not(span){text-transform:none;letter-spacing:0;font-family:var(--font-b);font-weight:400;color:var(--ink)}
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.toolbar .grow{margin-left:auto}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15px;font-weight:600}
.card-h .hint{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.card-b{padding:18px}
.card-b.flush{padding:0}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.kpi .k-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-family:var(--font-d);font-weight:500}
.kpi .k-val{font-family:var(--font-d);font-weight:700;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .k-val.sm{font-size:22px}
.kpi .k-foot{font-size:12.5px;color:var(--ink-2)}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--font-d);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
.t-strong{font-weight:600}
.t-sub{font-size:12.5px;color:var(--ink-3)}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3)}
.empty h3{font-size:16px;color:var(--ink-2);margin-bottom:6px}

/* ---------- chips / bars ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:100px;font-size:12px;font-family:var(--font-d);font-weight:500;white-space:nowrap;border:1px solid transparent}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.chip.risk{background:var(--risk-soft);color:var(--risk);border-color:color-mix(in srgb,var(--risk) 30%,transparent)}
.chip.info{background:var(--accent-soft);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.chip.mute{background:var(--neutral-soft);color:var(--ink-2);border-color:var(--line)}
.chip.plain::before{display:none}

.pbar{display:flex;align-items:center;gap:9px;min-width:130px}
.pbar .track{flex:1;height:7px;border-radius:100px;background:var(--surface-3);overflow:hidden;border:1px solid var(--line)}
.pbar .fill{height:100%;background:var(--accent);border-radius:100px}
.pbar .fill.ok{background:var(--ok)} .pbar .fill.warn{background:var(--warn)} .pbar .fill.risk{background:var(--risk)}
.pbar .pct{font-family:var(--font-m);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-2);width:38px;text-align:right}

/* ---------- gantt ---------- */
.gantt{position:relative;display:flex;border-top:1px solid var(--line)}
.g-left{flex:none;width:322px;border-right:1px solid var(--line);background:var(--surface);position:sticky;left:0;z-index:3}
.g-right{flex:1;overflow-x:auto;overflow-y:hidden;position:relative}
.g-canvas{position:relative}
.g-head{height:46px;border-bottom:1px solid var(--line);position:relative;background:var(--surface-2)}
.g-left .g-head{display:flex;align-items:flex-end;padding:0 14px 7px;font-family:var(--font-d);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.g-month{position:absolute;top:0;height:23px;border-left:1px solid var(--line);padding:4px 6px;font-family:var(--font-d);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.g-tick{position:absolute;top:23px;height:23px;border-left:1px solid var(--line);padding:4px 4px;font-size:10.5px;color:var(--ink-3);font-family:var(--font-m);white-space:nowrap;overflow:hidden}
.g-tick.we{background:var(--surface-3)}
.g-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);opacity:.55}
.g-grid.we{background:var(--surface-2);opacity:1;border-left-color:transparent}
.g-row{height:32px;border-bottom:1px solid var(--line);position:relative}
.g-left .g-row{display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13.5px;white-space:nowrap;overflow:hidden}
.g-row.phase{background:var(--surface-2)}
.g-left .g-row.phase{font-family:var(--font-d);font-weight:600;font-size:13px}
.g-left .g-row.task{padding-left:26px;color:var(--ink-2)}
.g-left .g-row .nm{overflow:hidden;text-overflow:ellipsis}
.g-bar{position:absolute;top:8px;height:16px;border-radius:4px;background:var(--accent);opacity:.9;overflow:hidden;cursor:default}
.g-bar .g-fill{height:100%;background:var(--bar-empty)}
.g-bar.phase{background:var(--ink-2);opacity:.55;height:10px;top:11px;border-radius:3px}
.g-bar.late{background:var(--risk)}
.g-bar.done{background:var(--ok)}
.g-bar .g-lab{position:absolute;left:calc(100% + 7px);top:-2px;font-size:11.5px;color:var(--ink-3);white-space:nowrap;font-family:var(--font-m)}
.g-ms{position:absolute;top:9px;width:14px;height:14px;background:var(--warn);transform:rotate(45deg);border-radius:2px}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--risk);z-index:2;pointer-events:none}
.g-today::after{content:"HOY";position:absolute;top:2px;left:4px;font-family:var(--font-d);font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--risk)}
.g-dep{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:visible}
.g-legend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 18px;font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r) var(--r)}
.g-legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:9px;border-radius:2px;display:inline-block}

/* ---------- bitacora ---------- */
.sem + .sem{border-top:1px solid var(--line)}
.sem-h{display:flex;align-items:baseline;gap:9px;padding:11px 18px;background:var(--surface-2);border-bottom:1px solid var(--line);
  font-family:var(--font-d);font-weight:600;font-size:13px}
.sem-m{margin-left:auto;font-family:var(--font-m);font-size:12px;font-weight:400;color:var(--ink-3)}
.sem table td{padding:9px 18px}
.hist{border:1px solid var(--line);border-radius:var(--r-sm);max-height:168px;overflow:auto;background:var(--surface-2)}
.hist table{font-size:13px}
.hist td{padding:6px 10px;border-bottom:1px solid var(--line)}
.hist tr:last-child td{border-bottom:0}
.hist .vacio{padding:14px;color:var(--ink-3);font-size:13px}

/* ---------- comunicaciones / interesados ---------- */
.quad{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.quad .q{border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;background:var(--surface-2);min-height:112px;display:flex;flex-direction:column;gap:7px}
.quad .q.gc{border-color:color-mix(in srgb,var(--risk) 45%,transparent);background:var(--risk-soft)}
.quad .q.mi{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft)}
.quad .q.ms{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft)}
.quad .q h4{font-family:var(--font-d);font-size:13px;font-weight:600;display:flex;align-items:baseline;gap:8px}
.quad .q h4 em{font-style:normal;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:500}
.quad .q ul{margin:0;padding-left:17px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.quad .q .none{font-size:12.5px;color:var(--ink-3);font-style:italic}
.axis{display:flex;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-family:var(--font-d);font-weight:500;margin-bottom:8px}
.eng td.st{text-align:center;font-family:var(--font-d);font-weight:700;font-size:12px;width:88px}
.eng td.st .a{color:var(--ink);border:1px solid var(--line-strong);background:var(--surface-3);border-radius:4px;padding:1px 6px;display:inline-block}
.eng td.st .d{color:var(--accent-ink);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft);border-radius:4px;padding:1px 6px;display:inline-block;margin-left:3px}
.subhead{font-family:var(--font-d);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 10px}
.nota{font-size:12.5px;color:var(--ink-2);max-width:74ch;margin:0}

/* ---------- resources ---------- */
.matrix td.cell{text-align:center;font-family:var(--font-m);font-variant-numeric:tabular-nums}
.matrix td.tot{font-weight:600;font-family:var(--font-m)}
.matrix td.over{color:var(--risk);font-weight:700}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:22px}

/* ---------- modal ---------- */
.ovl{position:fixed;inset:0;background:rgba(12,14,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 18px;z-index:100;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:min(660px,100%);box-shadow:0 18px 50px rgba(0,0,0,.3)}
.modal h2{font-size:17px;font-weight:700}
.modal-b{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-b .full{grid-column:1/-1}
.modal-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.err{color:var(--risk);font-size:13px;margin-right:auto;align-self:center}
.chkline{display:flex;align-items:center;gap:8px;font-size:14px}
.multi{border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px;max-height:130px;overflow:auto;display:flex;flex-direction:column;gap:5px;background:var(--surface)}

/* ---------- toast / banner ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:100px;font-size:13.5px;z-index:200;box-shadow:0 8px 26px rgba(0,0,0,.3);font-family:var(--font-d);font-weight:500}
.banner{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:var(--r);font-size:13.5px;border:1px solid}
.banner.val-warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--ink);align-items:flex-start}
.banner.val-ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 34%,transparent);color:var(--ink-2)}
.banner.ro{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 34%,transparent);color:var(--accent-ink)}
.saving{font-size:12.5px;color:var(--ink-3);font-family:var(--font-m)}

/* ---------- print ---------- */
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff;color:#000;font-size:11px}
  .topbar,.tabs,.no-print,.g-legend{display:none !important}
  main{padding:0;max-width:none}
  .print-head{display:block !important;margin-bottom:12px;border-bottom:2px solid #000;padding-bottom:8px}
  .card,.kpi{box-shadow:none;border:1px solid #999;break-inside:avoid}
  .chip{border:1px solid #666 !important;background:#fff !important;color:#000 !important}
  a{color:#000 !important}
  .ev{max-width:none}
  .ev span{white-space:normal;overflow:visible}
  .chip::before{background:#000}
  .pbar .track{border:1px solid #666}
  .pbar .fill,.pbar .fill.ok,.pbar .fill.warn,.pbar .fill.risk{background:#333 !important}
  th{background:#eee !important;color:#000}
  tbody tr:hover{background:none}
}
.print-head{display:none}
@media (max-width:720px){
  .modal-b{grid-template-columns:1fr}
  .g-left{width:180px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
<div id="root" aria-busy="true"></div>
<script type="application/json" id="db">{"v":3,"proyectos":[],"fases":[],"tareas":[],"entregables":[],"recursos":[],"asignaciones":[],"costos":[],"riesgos":[],"alcance":[],"interesados":[],"comunicaciones":[]}</script>
<script id="app">
(function(){
"use strict";
/* ============================ ESTADO ============================ */
var DB = JSON.parse(document.getElementById('db').textContent);
['proyectos','fases','tareas','entregables','recursos','asignaciones','costos','riesgos','alcance','interesados','comunicaciones','avances'].forEach(function(k){ if(!Array.isArray(DB[k])) DB[k]=[]; });
var root = document.getElementById('root');
var readOnly = false, saving = false, artifactNS = null, downloadsNS = null;
var UI = {tab:'resumen', proy:'*', zoom:'semana', eEstado:'*', eResp:'*', tFase:'*', tEstado:'*', rEstado:'*', bTarea:'*', bPeriodo:'8'};
try{ var s = sessionStorage.getItem('cp_ui'); if(s) UI = Object.assign(UI, JSON.parse(s)); }catch(e){}
function saveUI(){ try{ sessionStorage.setItem('cp_ui', JSON.stringify(UI)); }catch(e){} }

var HOY = (function(){ var d=new Date(); return iso(new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))); })();

/* ============================ UTILES ============================ */
function uid(p){ return p+'-'+Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function iso(d){ return d.toISOString().slice(0,10); }
function pd(s){ if(!s) return null; var a=String(s).split('-'); return Date.UTC(+a[0],+a[1]-1,+a[2]); }
function dnum(s){ var t=pd(s); return t===null?null:Math.round(t/864e5); }
function addD(s,n){ var t=pd(s); return iso(new Date(t+n*864e5)); }
function fdate(s){ if(!s) return '—'; var a=String(s).split('-'); return a[2]+'/'+a[1]+'/'+a[0]; }
function fdateL(s){ if(!s) return '—'; var M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; var a=String(s).split('-'); return a[2]+' '+M[+a[1]-1]+' '+a[0]; }
function diasEntre(a,b){ return (dnum(b)-dnum(a)); }
var COP = new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
var NUM = new Intl.NumberFormat('es-CO',{maximumFractionDigits:0});
function money(n){ n=Number(n)||0; return COP.format(n); }
function moneyK(n){ n=Number(n)||0; if(Math.abs(n)>=1e9) return '$'+ (n/1e9).toFixed(n>=1e10?0:1).replace('.',',') +' MM';
  if(Math.abs(n)>=1e6) return '$'+ (n/1e6).toFixed(n>=1e7?0:1).replace('.',',') +' M';
  if(Math.abs(n)>=1e3) return '$'+ NUM.format(Math.round(n/1e3)) +' mil'; return '$'+NUM.format(n); }
function byId(arr,id){ for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i]; return null; }
function pct(n){ n=Number(n)||0; return Math.max(0,Math.min(100,Math.round(n))); }
function clsAvance(v){ return v>=100?'ok':(v>=50?'':'warn'); }
function nombreRec(id){ var r=byId(DB.recursos,id); return r?r.nombre:'—'; }
function nombreProy(id){ var p=byId(DB.proyectos,id); return p?p.nombre:'—'; }
function codProy(id){ var p=byId(DB.proyectos,id); return p?(p.codigo||p.nombre):'—'; }
function sortBy(arr,f){ return arr.slice().sort(function(a,b){ var x=f(a),y=f(b); return x<y?-1:x>y?1:0; }); }

/* ---------- filtros / derivados ---------- */
function proyectosVisibles(){ return UI.proy==='*'?DB.proyectos:DB.proyectos.filter(function(p){return p.id===UI.proy;}); }
function idsVisibles(){ return proyectosVisibles().map(function(p){return p.id;}); }
function tareasDe(pid){ return DB.tareas.filter(function(t){return t.proyectoId===pid;}); }
function fasesDe(pid){
  return DB.fases.filter(function(f){return f.proyectoId===pid;}).slice().sort(function(a,b){
    var oa = (a.orden==null||a.orden==='')?9999:Number(a.orden), ob = (b.orden==null||b.orden==='')?9999:Number(b.orden);
    if(oa!==ob) return oa-ob;
    var fa=a.fechaInicio||'9999-12-31', fb=b.fechaInicio||'9999-12-31';
    return fa<fb?-1:fa>fb?1:0;
  });
}

function avanceCalculado(pid){
  var ts = tareasDe(pid); if(!ts.length) return null;
  var num=0, den=0;
  ts.forEach(function(t){ var d = Math.max(1,(diasEntre(t.fechaInicio,t.fechaFin)||0)+1); den+=d; num += d*(Number(t.avance)||0); });
  return den? Math.round(num/den) : null;
}
function rangoProyecto(p){
  var ts=tareasDe(p.id), fs=fasesDe(p.id), ini=p.fechaInicio, fin=p.fechaFin;
  ts.concat(fs).forEach(function(x){
    if(x.fechaInicio && (!ini || x.fechaInicio<ini)) ini=x.fechaInicio;
    if(x.fechaFin && (!fin || x.fechaFin>fin)) fin=x.fechaFin;
  });
  return {ini:ini,fin:fin};
}
var EST_PROY = ['Planeado','En curso','En riesgo','Retrasado','Cerrado'];
function chipProy(e){ var c = e==='Cerrado'?'ok': e==='En curso'?'info': e==='En riesgo'?'warn': e==='Retrasado'?'risk':'mute';
  return '<span class="chip '+c+'">'+esc(e||'Planeado')+'</span>'; }
var EST_ENT = ['Pendiente','En curso','Entregado','Aprobado','Retrasado'];
function chipEnt(e){ var c = (e==='Aprobado')?'ok':(e==='Entregado')?'info':(e==='En curso')?'info':(e==='Retrasado')?'risk':'mute';
  return '<span class="chip '+c+'">'+esc(e||'Pendiente')+'</span>'; }
var EST_TAR = ['Pendiente','En curso','Completada','Bloqueada'];
var EST_RIE = ['Abierto','En mitigación','Mitigado','Materializado','Cerrado'];
/* --- comunicaciones e interesados (PMBOK: dominio de interesados y comunicaciones) --- */
var FRECUENCIAS = ['Única (inicio)','Diaria','Semanal','Quincenal','Mensual','Por hito/entregable','Según necesidad','Única (cierre)'];
var CANALES = ['Reunión presencial','Videollamada (Meet)','Correo electrónico','Chat / Spaces','Informe escrito','Comité formal','Tablero / Dashboard','Repositorio documental'];
var CAT_INT = ['Gobernanza','Patrocinio','Equipo del proyecto','Cliente / usuario','Área técnica','Proveedor','Regulador'];
var POSTURAS = ['Desconoce','Resistente','Neutral','Apoya','Lidera'];
var NIVEL2 = ['Bajo','Alto'];
var EST_COM = ['Activa','En pausa','Cerrada'];

function idxPostura(v){ return POSTURAS.indexOf(v); }
function brechaInvolucramiento(i){
  var a=idxPostura(i.posturaActual), d=idxPostura(i.posturaDeseada);
  if(a<0||d<0) return null;
  return d-a;
}
function cuadrante(i){
  if(i.poder==='Alto' && i.interes==='Alto') return {k:'gc', t:'Gestionar de cerca', d:'Involucrar a fondo; consultar antes de decidir.'};
  if(i.poder==='Alto' && i.interes==='Bajo') return {k:'ms', t:'Mantener satisfecho', d:'Informar lo esencial, sin saturar.'};
  if(i.poder==='Bajo' && i.interes==='Alto') return {k:'mi', t:'Mantener informado', d:'Comunicación frecuente; son aliados.'};
  if(i.poder==='Bajo' && i.interes==='Bajo') return {k:'mo', t:'Monitorear', d:'Esfuerzo mínimo; revisar si cambia.'};
  return null;
}
function proximaCom(c){
  var f=c.fechaInicio; if(!f) return null;
  var fr=c.frecuencia||'';
  if(fr.indexOf('Única')===0) return {fecha:f, unica:true};
  if(fr==='Por hito/entregable'||fr==='Según necesidad') return {evento:true};
  var paso={'Diaria':1,'Semanal':7,'Quincenal':14}[fr];
  if(paso){
    var cur=f, g=0;
    while(cur<HOY && g++<5000) cur=addD(cur,paso);
    if(fr==='Diaria'){ var g2=0; while(g2++<7){ var dw=new Date(pd(cur)).getUTCDay(); if(dw===0||dw===6) cur=addD(cur,1); else break; } }
    return {fecha:cur};
  }
  if(fr==='Mensual'){
    var a=f.split('-'), y=+a[0], m=+a[1]-1, dd=+a[2], cur2=f, g3=0;
    while(cur2<HOY && g3++<600){ m++; if(m>11){m=0;y++;} var last=new Date(Date.UTC(y,m+1,0)).getUTCDate(); cur2=iso(new Date(Date.UTC(y,m,Math.min(dd,last)))); }
    return {fecha:cur2};
  }
  return null;
}
function chipCom(e){ var c=(e==='Activa')?'ok':(e==='En pausa')?'warn':'mute'; return '<span class="chip '+c+'">'+esc(e||'Activa')+'</span>'; }
var ESCALA = ['Baja','Media','Alta'];
function nivelRiesgo(r){
  var pi = ESCALA.indexOf(r.probabilidad)+1, ii = ESCALA.indexOf(r.impacto)+1;
  if(!pi || !ii) return {v:0, t:'Sin valorar', c:'mute'};
  var v = pi*ii;
  if(v>=6) return {v:v, t:'Alto', c:'risk'};
  if(v>=3) return {v:v, t:'Medio', c:'warn'};
  return {v:v, t:'Bajo', c:'ok'};
}
function chipRie(e){ var c=(e==='Cerrado'||e==='Mitigado')?'ok':(e==='Materializado')?'risk':(e==='En mitigación')?'info':'mute'; return '<span class="chip '+c+'">'+esc(e||'Abierto')+'</span>'; }
function chipTar(e){ var c=(e==='Completada')?'ok':(e==='En curso')?'info':(e==='Bloqueada')?'risk':'mute'; return '<span class="chip '+c+'">'+esc(e||'Pendiente')+'</span>'; }

/* El avance de un entregable es el promedio simple del avance de las tareas de la fase
   que lo produce — el mismo criterio que usa el cronograma en Excel. */
function avanceCalcEntregable(e){
  if(!e.faseId) return null;
  var ts = DB.tareas.filter(function(t){ return t.faseId===e.faseId; });
  if(!ts.length) return null;
  var suma = 0; ts.forEach(function(t){ suma += pct(t.avance); });
  return {v: Math.round(suma/ts.length), n: ts.length};
}
function desajusteEntregable(e){
  var c = avanceCalcEntregable(e);
  if(!c) return null;
  return (pct(e.avance) === c.v) ? null : c;
}
/* La evidencia se guarda tal cual la escribe el usuario; solo se vuelve enlace
   si es una URL http(s). Cualquier otro esquema se muestra como texto plano. */
function normalizaURL(v){
  v = String(v==null?'':v).trim();
  if(!v) return '';
  if(/^https?:\/\//i.test(v)) return v;
  if(/^[a-z][a-z0-9+.-]*:/i.test(v)) return v;              /* otro esquema: se deja como texto */
  if(/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(v)) return 'https://'+v;  /* dominio sin esquema */
  return v;
}
function linkEvidencia(v){
  v = String(v==null?'':v).trim();
  if(!v) return '<span style="color:var(--ink-3)">—</span>';
  if(/^https?:\/\//i.test(v)){
    var etq = v.replace(/^https?:\/\//i,'').replace(/\/+$/,'');
    if(etq.length>36) etq = etq.slice(0,34)+'…';
    return '<a class="ev" href="'+esc(v)+'" target="_blank" rel="noopener noreferrer" title="'+esc(v)+'">'
      + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M10 6H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5"/><path d="M14 3h7v7"/><path d="M10 14 21 3"/></svg>'
      + '<span>'+esc(etq)+'</span></a>';
  }
  return '<span class="t-sub">'+esc(v)+'</span>';
}
/* ---------- bitacora de avances ---------- */
/* HOY se fija al cargar la pagina; un registro nuevo necesita la fecha del momento. */
function hoyReal(){ var d=new Date(); return iso(new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()))); }
function inicioSemana(f){ var dow=(new Date(pd(f)).getUTCDay()+6)%7; return addD(f,-dow); }
function etiquetaSemana(ini){
  var fin = addD(ini,6);
  return 'Semana del '+fdate(ini).slice(0,5)+' al '+fdateL(fin);
}
function registrarAvance(t, nuevo, nota, autor, fecha){
  var ant = pct(t.avance), nv = pct(nuevo);
  DB.avances.push({ id:uid('av'), proyectoId:t.proyectoId, tareaId:t.id,
    fecha: fecha || hoyReal(), ts: new Date().toISOString(),
    avanceAnterior: ant, avanceNuevo: nv, delta: nv-ant,
    nota: nota||'', autor: autor||'' });
  t.avance = nv;
  return nv-ant;
}
function avancesDe(tareaId){
  return DB.avances.filter(function(a){ return a.tareaId===tareaId; })
    .sort(function(a,b){ var x=(a.fecha||'')+(a.ts||''), y=(b.fecha||'')+(b.ts||''); return x<y?1:x>y?-1:0; });
}
function ultimoAvance(tareaId){ var l=avancesDe(tareaId); return l.length? l[0] : null; }
function chipDelta(d){
  if(d>0) return '<span class="chip ok">+'+d+' pts</span>';
  if(d<0) return '<span class="chip risk">'+d+' pts</span>';
  return '<span class="chip mute plain">sin cambio</span>';
}
function entAbierto(e){ var x=e.estado||'Pendiente'; return x!=='Aprobado' && x!=='Entregado'; }
function alertaFecha(fecha, cerrado){
  if(!fecha || cerrado) return null;
  var d = diasEntre(HOY, fecha);
  if(d<0) return {c:'risk', t:'Vencido hace '+Math.abs(d)+' d'};
  if(d===0) return {c:'warn', t:'Vence hoy'};
  if(d<=7) return {c:'warn', t:'En '+d+' d'};
  return null;
}
function barra(v, extra){ v=pct(v); return '<div class="pbar"><div class="track"><div class="fill '+(extra||clsAvance(v))+'" style="width:'+v+'%"></div></div><span class="pct">'+v+'%</span></div>'; }

/* ============================ PERSISTENCIA ============================ */
function buildDoc(){
  var css = document.getElementById('css').textContent;
  var js  = document.getElementById('app').textContent;
  var data = JSON.stringify(DB).replace(/</g,'\\u003c');
  return '<!doctype html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n'
    + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
    + '<title>Control de Portafolio<\/title>\n'
    + '<link rel="preconnect" href="https://fonts.googleapis.com">\n'
    + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
    + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">\n'
    + '<style id="css">' + css + '<\/style>\n</head>\n<body>\n'
    + '<div id="root" aria-busy="true"><\/div>\n'
    + '<script type="application/json" id="db">' + data + '<\/script>\n'
    + '<script id="app">' + js + '<\/script>\n</body>\n</html>';
}
function toast(msg, ms){
  var old=document.querySelector('.toast'); if(old) old.remove();
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg; t.setAttribute('role','status'); document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.remove(); }, ms||2600);
}
var pending=null, timer=null;
function guardar(msg){
  if(readOnly){ toast('Vista de solo lectura: no se guardan cambios.'); return; }
  pending = msg||'Guardado';
  saving = true; render();
  clearTimeout(timer);
  timer = setTimeout(hacerGuardado, 400); /* agrupa cambios rapidos en una sola publicacion */
}
function hacerGuardado(){
  if(!artifactNS){ saving=false; render(); toast('Guardado no disponible en esta vista.'); return; }
  saveUI();
  artifactNS.publish(buildDoc()).then(function(){
    /* la vista se recarga sola tras publicar */
  })['catch'](function(err){
    saving=false;
    var code = err && err.code;
    if(code==='conflict'){ toast('Otra persona guardó primero. Cargando la versión más reciente…', 4000); return; }
    if(code==='not_writer'||code==='not_granted'||code==='not_declared'||code==='consent_required'||code==='capability_disabled'||code==='capability_removed'){
      readOnly=true; render(); toast('Esta vista es de solo lectura.', 4000); return;
    }
    if(code==='rate_limited'){ toast('Demasiados guardados seguidos. Intenta en unos segundos.', 4000); render(); return; }
    if(code==='too_large'){ toast('El tablero superó el tamaño máximo. Archiva proyectos cerrados.', 5000); render(); return; }
    toast('No se pudo guardar. Vuelve a intentarlo.', 4000); render();
  });
}

var TABS = [['resumen','Resumen ejecutivo'],['cronograma','Cronograma'],['entregables','Entregables'],['tareas','Tareas'],['riesgos','Riesgos'],['bitacora','Bitácora'],['comunicaciones','Comunicaciones'],['recursos','Recursos y costos'],['ficha','Ficha del proyecto'],['datos','Datos']];

function vacio(titulo, texto, boton){

}

/* ============================ VISTA: RESUMEN ============================ */
function vistaResumen(){
  var ps = proyectosVisibles();
  if(!DB.proyectos.length) return '<div class="card"><div class="card-b">'+vacio(
      'Aún no hay proyectos','Crea tu primer proyecto para empezar a construir el cronograma, los entregables y la asignación de recursos.',
      '<div style="margin-top:14px;display:flex;gap:10px;justify-content:center"><button class="btn btn-primary" data-act="nuevo-proyecto">Crear proyecto</button><button class="btn" data-act="ejemplo">Cargar proyecto de ejemplo</button></div>')+'</div></div>';

  var activos = ps.filter(function(p){ return p.estado!=='Cerrado'; });
  var presu=0, ejec=0, sumAv=0, pesos=0;
  ps.forEach(function(p){
    presu += Number(p.presupuestoCOP)||0;
    ejec  += costoEjecutado(p.id);
    var w = (Number(p.presupuestoCOP)||0) || 1;
    if(p.estado!=='Cerrado'){ sumAv += pct(p.avanceManual)*w; pesos += w; }
  });
  var avgAv = pesos? Math.round(sumAv/pesos) : 0;
  var ids = idsVisibles();
  var ents = DB.entregables.filter(function(e){ return ids.indexOf(e.proyectoId)>=0; });
  var prox30 = ents.filter(function(e){ var d=diasEntre(HOY,e.fechaComprometida); return entAbierto(e) && d!=null && d>=0 && d<=30; });
  var vencidos = ents.filter(function(e){ return entAbierto(e) && e.fechaComprometida && diasEntre(HOY,e.fechaComprometida)<0; });
  var enRiesgo = ps.filter(function(p){ return p.estado==='En riesgo'||p.estado==='Retrasado'; });

  var kpis = '<section class="kpis">'
    + kpi('Proyectos activos', activos.length, ps.length+' en el portafolio · '+enRiesgo.length+' en riesgo o retrasados')
    + kpi('Avance promedio', avgAv+'%', 'Ponderado por presupuesto, sobre proyectos abiertos')
    + kpi('Entregables próximos 30 días', prox30.length, vencidos.length? vencidos.length+' vencido'+(vencidos.length===1?'':'s')+' sin entregar' : 'Ninguno vencido')
    + kpiSm('Presupuesto vs. ejecutado', presu? moneyK(ejec)+' / '+moneyK(presu) : (ejec? moneyK(ejec)+' ejecutado' : 'Sin registrar'), presu? Math.round(ejec/presu*100)+'% del presupuesto consumido' : 'Carga el presupuesto en la ficha del proyecto')
    + '</section>';

  var filas = sortBy(ps,function(p){return (p.estado==='Cerrado'?'z':'a')+(p.fechaFin||'9999');}).map(function(p){
    var av = pct(p.avanceManual), calc = avanceCalculado(p.id);
    var r = rangoProyecto(p);
    var eje = costoEjecutado(p.id), pre = Number(p.presupuestoCOP)||0;
    var al = alertaFecha(r.fin, p.estado==='Cerrado');
    return '<tr>'
      + '<td><div class="t-strong">'+esc(p.nombre)+'</div><div class="t-sub mono">'+esc(p.codigo||'')+(p.cliente?' · '+esc(p.cliente):'')+'</div></td>'
      + '<td>'+chipProy(p.estado)+'</td>'
      + '<td>'+barra(av)+ (calc!=null && Math.abs(calc-av)>=10 ? '<div class="t-sub">calculado por tareas: '+calc+'%</div>':'') +'</td>'
      + '<td class="mono" style="font-size:12.5px;white-space:nowrap">'+fdate(r.ini)+' → '+fdate(r.fin)+ (al?'<div><span class="chip '+al.c+'">'+esc(al.t)+'</span></div>':'') +'</td>'
      + '<td class="r num">'+ (pre? money(pre) : '—') +'</td>'
      + '<td class="r num"'+(pre&&eje>pre?' style="color:var(--risk);font-weight:600"':'')+'>'+ (eje? money(eje):'—') +'</td>'
      + '<td>'+esc(p.gerente||'—')+'</td>'
      + (readOnly?'':'<td class="r no-print"><button class="btn btn-sm btn-ghost" data-act="edit-proyecto" data-id="'+p.id+'">Editar</button></td>')
      + '</tr>';
  }).join('');

  var tabla = '<section class="card"><div class="card-h"><h2>Portafolio</h2><span class="hint">'+ps.length+' proyecto'+(ps.length===1?'':'s')+'</span></div>'
    + '<div class="card-b flush"><div class="tw"><table><thead><tr>'
    + '<th>Proyecto</th><th>Estado</th><th style="min-width:170px">Avance</th><th>Ventana</th><th class="r">Presupuesto</th><th class="r">Ejecutado</th><th>Gerente</th>'
    + (readOnly?'':'<th class="no-print"></th>')
    + '</tr></thead><tbody>'+filas+'</tbody></table></div></div></section>';

  return kpis + tabla + bloqueEntregas(ents);
}
function kpi(l,v,f){ return '<div class="kpi"><span class="k-label">'+esc(l)+'</span><span class="k-val">'+esc(String(v))+'</span><span class="k-foot">'+esc(f)+'</span></div>'; }
function kpiSm(l,v,f){ return '<div class="kpi"><span class="k-label">'+esc(l)+'</span><span class="k-val sm">'+esc(String(v))+'</span><span class="k-foot">'+esc(f)+'</span></div>'; }

function finSemana(){ var d=new Date(pd(HOY)); var dow=(d.getUTCDay()+6)%7; return addD(HOY, 6-dow); }
function finMes(){ var d=new Date(pd(HOY)); return iso(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0))); }

function bloqueEntregas(ents){
  var fs = finSemana(), fm = finMes();
  var abiertas = ents.filter(function(e){ return entAbierto(e) && e.fechaComprometida; });
  var sem = sortBy(abiertas.filter(function(e){ return e.fechaComprometida<=fs; }), function(e){return e.fechaComprometida;});
  var mes = sortBy(abiertas.filter(function(e){ return e.fechaComprometida>fs && e.fechaComprometida<=fm; }), function(e){return e.fechaComprometida;});
  function lista(arr, vacioTxt){
    if(!arr.length) return '<div class="empty" style="padding:26px"><p>'+esc(vacioTxt)+'</p></div>';
    return '<div class="tw"><table><tbody>'+arr.map(function(e){
      var al = alertaFecha(e.fechaComprometida, false);
      return '<tr><td style="width:96px" class="mono t-sub">'+fdate(e.fechaComprometida)+'</td>'
        + '<td><div class="t-strong">'+esc(e.nombre)+'</div><div class="t-sub">'+esc(codProy(e.proyectoId))+' · '+esc(nombreRec(e.responsableId))+'</div></td>'
        + '<td class="r">'+chipEnt(e.estado)+(al?' <span class="chip '+al.c+'">'+esc(al.t)+'</span>':'')
        + (e.evidencia?'<div style="margin-top:3px">'+linkEvidencia(e.evidencia)+'</div>':'')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
  }
  return '<section class="split">'
    + '<div class="card"><div class="card-h"><h2>Se entrega esta semana</h2><span class="hint">hasta el '+fdate(fs)+'</span></div><div class="card-b flush">'+lista(sem,'Nada comprometido para esta semana.')+'</div></div>'
    + '<div class="card"><div class="card-h"><h2>Resto del mes</h2><span class="hint">hasta el '+fdate(fm)+'</span></div><div class="card-b flush">'+lista(mes,'Nada más comprometido este mes.')+'</div></div>'
    + tarjetaRiesgos()
    + '</section>';
}

function tarjetaRiesgos(){
  var ids = idsVisibles();
  var abiertos = DB.riesgos.filter(function(r){ return ids.indexOf(r.proyectoId)>=0 && r.estado!=='Cerrado' && r.estado!=='Mitigado'; });
  abiertos = abiertos.slice().sort(function(a,b){ return nivelRiesgo(b).v - nivelRiesgo(a).v; }).slice(0,5);
  var cuerpo = abiertos.length
    ? '<div class="tw"><table><tbody>'+abiertos.map(function(r){ var n=nivelRiesgo(r);
        return '<tr><td><div class="t-strong">'+esc(r.nombre)+'</div>'+(r.planContingencia?'<div class="t-sub">Contingencia: '+esc(r.planContingencia)+'</div>':'')+'</td>'
          + '<td class="r"><span class="chip '+n.c+'">'+esc(n.t)+'</span></td></tr>'; }).join('')+'</tbody></table></div>'
    : '<div class="empty" style="padding:26px"><p>Sin riesgos abiertos registrados.</p></div>';
  return '<div class="card"><div class="card-h"><h2>Riesgos priorizados</h2><span class="hint">'+abiertos.length+' abierto'+(abiertos.length===1?'':'s')+'</span></div><div class="card-b flush">'+cuerpo+'</div></div>';
}

/* ============================ VISTA: RIESGOS ============================ */
function vistaRiesgos(){
  var ids = idsVisibles();
  var todos = DB.riesgos.filter(function(r){ return ids.indexOf(r.proyectoId)>=0; });
  var lista = todos.filter(function(r){ return UI.rEstado==='*' || (r.estado||'Abierto')===UI.rEstado; });
  lista = lista.slice().sort(function(a,b){ return nivelRiesgo(b).v - nivelRiesgo(a).v; });
  var optEst = '<option value="*">Todos los estados</option>'+EST_RIE.map(function(e){return '<option'+(UI.rEstado===e?' selected':'')+'>'+e+'</option>';}).join('');
  var cuerpo = lista.map(function(r){ var n=nivelRiesgo(r);
    return '<tr>'
      + '<td><div class="t-strong">'+esc(r.nombre)+'</div><div class="t-sub">'+esc(codProy(r.proyectoId))+(r.categoria?' · '+esc(r.categoria):'')+'</div></td>'
      + '<td class="c">'+(r.probabilidad?esc(r.probabilidad):'—')+'</td>'
      + '<td class="c">'+(r.impacto?esc(r.impacto):'—')+'</td>'
      + '<td><span class="chip '+n.c+'">'+esc(n.t)+'</span></td>'
      + '<td>'+esc(r.planContingencia||'—')+'</td>'
      + '<td>'+esc(nombreRec(r.responsableId))+'</td>'
      + '<td>'+chipRie(r.estado)+'</td>'
      + (readOnly?'':'<td class="r no-print"><button class="btn btn-sm btn-ghost" data-act="edit-riesgo" data-id="'+r.id+'">Editar</button></td>')
      + '</tr>'; }).join('');
  return '<section class="card"><div class="card-h"><h2>Riesgos y plan de contingencia</h2><span class="hint">'+lista.length+' de '+todos.length+'</span></div>'
    + '<div class="card-b no-print"><div class="toolbar">'
    + '<label class="fld"><span>Estado</span><select data-ui="rEstado">'+optEst+'</select></label>'
    + (readOnly?'':'<div class="grow"><button class="btn btn-primary" data-act="nuevo-riesgo">+ Riesgo</button></div>')
    + '</div></div>'
    + '<div class="card-b flush">'+(cuerpo
      ? '<div class="tw"><table><thead><tr><th>Riesgo</th><th class="c">Probab.</th><th class="c">Impacto</th><th>Nivel</th><th>Plan de contingencia</th><th>Responsable</th><th>Estado</th>'+(readOnly?'':'<th class="no-print"></th>')+'</tr></thead><tbody>'+cuerpo+'</tbody></table></div>'
      : vacio('Sin riesgos registrados','Registra los riesgos del proyecto con su probabilidad, impacto y plan de contingencia.','<div style="margin-top:12px"><button class="btn btn-primary" data-act="nuevo-riesgo">Registrar riesgo</button></div>'))
    + '</div>'
    + '<div class="g-legend no-print">El nivel se calcula cruzando probabilidad e impacto: Alto (rojo) exige plan activo, Medio seguimiento, Bajo monitoreo.</div>'
    + '</section>';
}

/* ============================ VISTA: BITÁCORA DE AVANCES ============================ */
function vistaBitacora(){
  var ids = idsVisibles();
  var todos = DB.avances.filter(function(a){ return ids.indexOf(a.proyectoId)>=0; });

  var semActual = inicioSemana(HOY);
  var deSemana = todos.filter(function(a){ return a.fecha>=semActual && a.fecha<=addD(semActual,6); });
  var tocadas = {}; deSemana.forEach(function(a){ tocadas[a.tareaId]=1; });
  var puntos = deSemana.reduce(function(s,a){ return s+(Number(a.delta)||0); }, 0);
  var sinNota = todos.filter(function(a){ return !a.nota; }).length;

  var kpis = '<section class="kpis">'
    + kpi('Registros esta semana', deSemana.length, etiquetaSemana(semActual))
    + kpi('Puntos de avance', (puntos>0?'+':'')+puntos, 'Suma de los cambios de porcentaje en la semana')
    + kpi('Tareas movidas', Object.keys(tocadas).length, deSemana.length? 'Sobre '+DB.tareas.filter(function(t){return ids.indexOf(t.proyectoId)>=0;}).length+' tareas del filtro' : 'Ninguna tarea reportada aún')
    + kpi('Registros acumulados', todos.length, sinNota? sinNota+' sin nota' : (todos.length? 'Todos con nota':'Sin registros'))
    + '</section>';

  /* --- filtros --- */
  var tareasFiltro = DB.tareas.filter(function(t){ return ids.indexOf(t.proyectoId)>=0; });
  var optTarea = '<option value="*">Todas las tareas</option>' + sortBy(tareasFiltro,function(t){return t.nombre;})
    .map(function(t){ return '<option value="'+t.id+'"'+(UI.bTarea===t.id?' selected':'')+'>'+esc(t.nombre)+'</option>'; }).join('');
  var PERIODOS = [['4','Últimas 4 semanas'],['8','Últimas 8 semanas'],['26','Últimas 26 semanas'],['*','Todo el historial']];
  var optPeriodo = PERIODOS.map(function(p){ return '<option value="'+p[0]+'"'+(UI.bPeriodo===p[0]?' selected':'')+'>'+p[1]+'</option>'; }).join('');

  var lista = todos.filter(function(a){
    if(UI.bTarea!=='*' && a.tareaId!==UI.bTarea) return false;
    if(UI.bPeriodo!=='*' && a.fecha < addD(semActual, -7*(Number(UI.bPeriodo)-1))) return false;
    return true;
  });

  /* --- agrupado por semana, de la más reciente a la más antigua --- */
  var semanas = {};
  lista.forEach(function(a){ var k=inicioSemana(a.fecha); (semanas[k]=semanas[k]||[]).push(a); });
  var claves = Object.keys(semanas).sort().reverse();

  var cuerpo = claves.map(function(k){
    var filas = semanas[k].slice().sort(function(a,b){ var x=(a.fecha||'')+(a.ts||''), y=(b.fecha||'')+(b.ts||''); return x<y?1:x>y?-1:0; });
    var pts = filas.reduce(function(s,a){ return s+(Number(a.delta)||0); }, 0);
    var esActual = (k===semActual);
    return '<div class="sem">'
      + '<div class="sem-h">'+esc(etiquetaSemana(k))
      +   (esActual? ' <span class="chip info">En curso</span>':'')
      +   '<span class="sem-m">'+filas.length+' registro'+(filas.length===1?'':'s')+' · '+(pts>0?'+':'')+pts+' pts</span></div>'
      + '<div class="tw"><table><tbody>'
      + filas.map(function(a){
          var t = byId(DB.tareas, a.tareaId);
          var f = t? byId(DB.fases, t.faseId) : null;
          return '<tr>'
            + '<td class="mono t-sub" style="width:92px;white-space:nowrap">'+fdate(a.fecha)+'</td>'
            + '<td><div class="t-strong">'+esc(t? t.nombre : 'Tarea eliminada')+'</div>'
            +   '<div class="t-sub">'+esc(codProy(a.proyectoId))+(f?' · '+esc(f.nombre):'')+(a.autor?' · '+esc(a.autor):'')+'</div></td>'
            + '<td style="width:150px;white-space:nowrap"><span class="mono">'+a.avanceAnterior+'% → '+a.avanceNuevo+'%</span><div>'+chipDelta(a.delta)+'</div></td>'
            + '<td>'+(a.nota? esc(a.nota) : '<span style="color:var(--ink-3)">Sin nota</span>')+'</td>'
            + (readOnly?'':'<td class="r no-print"><button class="btn btn-sm btn-ghost" data-act="edit-avance" data-id="'+a.id+'">Editar</button></td>')
            + '</tr>';
        }).join('')
      + '</tbody></table></div></div>';
  }).join('');

  return kpis
    + '<section class="card"><div class="card-h"><h2>Bitácora de avances</h2>'
    + '<span class="hint">'+lista.length+' de '+todos.length+' registro'+(todos.length===1?'':'s')+'</span></div>'
    + '<div class="card-b no-print"><div class="toolbar">'
    + '<label class="fld"><span>Tarea</span><select data-ui="bTarea">'+optTarea+'</select></label>'
    + '<label class="fld"><span>Periodo</span><select data-ui="bPeriodo">'+optPeriodo+'</select></label>'
    + (readOnly?'':'<div class="grow"><button class="btn btn-primary" data-act="nuevo-avance">+ Registrar avance</button></div>')
    + '</div></div>'
    + '<div class="card-b flush">'+(cuerpo || vacio('Sin avances registrados',
        'Cada vez que muevas el porcentaje de una tarea, el tablero guarda la fecha automáticamente y te deja dejar una nota. Así se arma la trazabilidad semana a semana.',
        '<div style="margin-top:12px"><button class="btn btn-primary" data-act="nuevo-avance">Registrar el primer avance</button></div>'))+'</div>'
    + '</section>';
}

/* ============================ VISTA: COMUNICACIONES ============================ */
function vistaComunicaciones(){
  var ids = idsVisibles();
  var coms = DB.comunicaciones.filter(function(c){ return ids.indexOf(c.proyectoId)>=0; });
  var ints = DB.interesados.filter(function(i){ return ids.indexOf(i.proyectoId)>=0; });

  /* --- KPIs --- */
  var activas = coms.filter(function(c){ return (c.estado||'Activa')==='Activa'; });
  var prox7 = activas.filter(function(c){ var p=proximaCom(c); return p && p.fecha && diasEntre(HOY,p.fecha)>=0 && diasEntre(HOY,p.fecha)<=7; });
  var conBrecha = ints.filter(function(i){ var b=brechaInvolucramiento(i); return b!==null && b>0; });
  var sinValorar = ints.filter(function(i){ return !i.posturaActual; });
  var kpis = '<section class="kpis">'
    + kpi('Interesados registrados', ints.length, sinValorar.length? sinValorar.length+' sin valorar postura' : 'Todos valorados')
    + kpi('Comunicaciones activas', activas.length, coms.length+' en la matriz')
    + kpi('Próximas 7 días', prox7.length, prox7.length? prox7.map(function(c){return c.que;}).slice(0,2).join(' · ') : 'Nada programado en la semana')
    + kpi('Brechas de involucramiento', conBrecha.length, conBrecha.length? 'Postura actual por debajo de la deseada' : 'Sin brechas abiertas')
    + '</section>';

  /* --- 1. matriz de comunicaciones --- */
  var filasCom = sortBy(coms, function(c){ var p=proximaCom(c); return (p&&p.fecha)?p.fecha:'9999-99-99'; }).map(function(c){
    var p = proximaCom(c);
    var prox = '—', chip='';
    if(p && p.fecha){
      prox = fdate(p.fecha);
      var dd = diasEntre(HOY,p.fecha);
      if(p.unica && dd<0) chip = '<span class="chip mute">Ya ocurrió</span>';
      else if(dd===0) chip = '<span class="chip warn">Hoy</span>';
      else if(dd>0 && dd<=7) chip = '<span class="chip warn">En '+dd+' d</span>';
    } else if(p && p.evento){ prox = 'Por evento'; }
    return '<tr>'
      + '<td><div class="t-strong">'+esc(c.que)+'</div><div class="t-sub">'+esc(c.porQue||'')+'</div></td>'
      + '<td>'+esc(c.destinatarios||'—')+'</td>'
      + '<td>'+esc(c.canal||'—')+'</td>'
      + '<td>'+esc(c.frecuencia||'—')+'</td>'
      + '<td class="mono" style="white-space:nowrap">'+prox+(chip?'<div>'+chip+'</div>':'')+'</td>'
      + '<td class="t-sub">'+esc(c.responsablePrep||'—')+'</td>'
      + '<td class="t-sub">'+esc(c.aprueba||'—')+'</td>'
      + '<td class="t-sub">'+esc(c.envia||'—')+'</td>'
      + '<td>'+chipCom(c.estado)+'</td>'
      + (readOnly?'':'<td class="r no-print"><button class="btn btn-sm btn-ghost" data-act="edit-com" data-id="'+c.id+'">Editar</button></td>')
      + '</tr>';
  }).join('');
  var bloqueCom = '<section class="card"><div class="card-h"><h2>Matriz de comunicaciones</h2><span class="hint">qué · por qué · a quién · cómo · cuándo · quién responde</span></div>'
    + (readOnly?'':'<div class="card-b no-print"><div class="toolbar"><button class="btn btn-primary" data-act="nueva-com">+ Comunicación</button></div></div>')
    + '<div class="card-b flush">'+(filasCom
      ? '<div class="tw"><table><thead><tr><th style="min-width:230px">Qué se comunica / propósito</th><th>Destinatarios</th><th>Canal</th><th>Frecuencia</th><th>Próxima</th><th>Prepara</th><th>Aprueba</th><th>Envía</th><th>Estado</th>'+(readOnly?'':'<th class="no-print"></th>')+'</tr></thead><tbody>'+filasCom+'</tbody></table></div>'
      : vacio('Sin matriz de comunicaciones','Define qué se comunica, a quién, por qué canal, con qué frecuencia y quién prepara, aprueba y envía cada comunicación.','<div style="margin-top:12px;display:flex;gap:10px;justify-content:center"><button class="btn btn-primary" data-act="nueva-com">Crear comunicación</button><button class="btn" data-act="plan-base">Cargar plan base PMBOK</button></div>'))
    + '</div></section>';

  /* --- 2. mapa poder / interés --- */
  var Q = {gc:[],ms:[],mi:[],mo:[]};
  ints.forEach(function(i){ var q=cuadrante(i); if(q) Q[q.k].push(i.nombre); });
  var sinUbicar = ints.filter(function(i){ return !cuadrante(i); });
  function celda(k,titulo,sub,desc){
    return '<div class="q '+k+'"><h4>'+esc(titulo)+' <em>'+esc(sub)+'</em></h4>'
      + (Q[k].length? '<ul>'+Q[k].map(function(n){return '<li>'+esc(n)+'</li>';}).join('')+'</ul>' : '<span class="none">Sin interesados en este cuadrante.</span>')
      + '<span class="t-sub" style="margin-top:auto">'+esc(desc)+'</span></div>';
  }
  var bloqueMapa = '<section class="card"><div class="card-h"><h2>Mapa de interesados</h2><span class="hint">poder × interés</span></div><div class="card-b">'
    + '<div class="axis"><span>Poder alto ↑</span><span>·</span><span>Interés →</span></div>'
    + '<div class="quad">'
    +   celda('ms','Mantener satisfecho','poder alto · interés bajo','Informar lo esencial, sin saturar.')
    +   celda('gc','Gestionar de cerca','poder alto · interés alto','Involucrar a fondo; consultar antes de decidir.')
    +   celda('mo','Monitorear','poder bajo · interés bajo','Esfuerzo mínimo; revisar si cambia.')
    +   celda('mi','Mantener informado','poder bajo · interés alto','Comunicación frecuente; son aliados.')
    + '</div>'
    + (sinUbicar.length? '<p class="nota" style="margin-top:12px">'+sinUbicar.length+' interesado'+(sinUbicar.length===1?'':'s')+' sin poder o interés valorado, así que no aparece'+(sinUbicar.length===1?'':'n')+' en el mapa: '+esc(sinUbicar.map(function(i){return i.nombre;}).join(', '))+'.</p>' : '')
    + '</div></section>';

  /* --- 3. registro de interesados --- */
  var filasInt = ints.map(function(i){
    var q=cuadrante(i), b=brechaInvolucramiento(i);
    var chipB = b===null? '<span class="chip mute">Por valorar</span>'
      : b>0? '<span class="chip warn">Brecha de '+b+'</span>'
      : b<0? '<span class="chip info">Por encima</span>'
      : '<span class="chip ok">Alineado</span>';
    return '<tr>'
      + '<td><div class="t-strong">'+esc(i.nombre)+'</div><div class="t-sub">'+esc(i.rol||'')+(i.organizacion?' · '+esc(i.organizacion):'')+'</div></td>'
      + '<td>'+esc(i.categoria||'—')+'</td>'
      + '<td class="c">'+esc(i.poder||'—')+'</td>'
      + '<td class="c">'+esc(i.interes||'—')+'</td>'
      + '<td>'+(q?'<span class="chip '+(q.k==='gc'?'risk':q.k==='mi'?'info':q.k==='ms'?'warn':'mute')+'">'+esc(q.t)+'</span>':'<span class="chip mute">Sin ubicar</span>')+'</td>'
      + '<td style="white-space:nowrap">'+esc(i.posturaActual||'—')+' → '+esc(i.posturaDeseada||'—')+'<div>'+chipB+'</div></td>'
      + '<td>'+esc(i.necesidades||'—')+'</td>'
      + '<td>'+esc(i.estrategia||'—')+'</td>'
      + (readOnly?'':'<td class="r no-print"><button class="btn btn-sm btn-ghost" data-act="edit-interesado" data-id="'+i.id+'">Editar</button></td>')
      + '</tr>';
  }).join('');
  var bloqueInt = '<section class="card"><div class="card-h"><h2>Registro de interesados</h2><span class="hint">'+ints.length+' registrado'+(ints.length===1?'':'s')+'</span></div>'
    + (readOnly?'':'<div class="card-b no-print"><div class="toolbar"><button class="btn btn-primary" data-act="nuevo-interesado">+ Interesado</button></div></div>')
    + '<div class="card-b flush">'+(filasInt
      ? '<div class="tw"><table><thead><tr><th style="min-width:190px">Interesado</th><th>Categoría</th><th class="c">Poder</th><th class="c">Interés</th><th>Estrategia base</th><th>Postura actual → deseada</th><th>Necesita saber</th><th>Cómo lo involucro</th>'+(readOnly?'':'<th class="no-print"></th>')+'</tr></thead><tbody>'+filasInt+'</tbody></table></div>'
      : vacio('Sin interesados registrados','Identificar interesados es un proceso continuo, no un evento de inicio: registra a cada persona, grupo u organización que afecte o resulte afectada por el proyecto.','<div style="margin-top:12px"><button class="btn btn-primary" data-act="nuevo-interesado">Registrar interesado</button></div>'))
    + '</div></section>';

  /* --- 4. matriz de evaluación del involucramiento --- */
  var bloqueEval = '';
  if(ints.length){
    var cab = POSTURAS.map(function(pp){ return '<th class="c">'+esc(pp)+'</th>'; }).join('');
    var filasEv = ints.map(function(i){
      return '<tr><td class="t-strong">'+esc(i.nombre)+'</td>'
        + POSTURAS.map(function(pp){
            var a = i.posturaActual===pp, d = i.posturaDeseada===pp;
            return '<td class="st">'+(a?'<span class="a">A</span>':'')+(d?'<span class="d">D</span>':'')+'</td>';
          }).join('')
        + '</tr>';
    }).join('');
    bloqueEval = '<section class="card"><div class="card-h"><h2>Matriz de evaluación del involucramiento</h2><span class="hint">A = actual · D = deseada</span></div>'
      + '<div class="card-b flush"><div class="tw"><table class="eng"><thead><tr><th>Interesado</th>'+cab+'</tr></thead><tbody>'+filasEv+'</tbody></table></div></div>'
      + '<div class="g-legend no-print">Cuando A y D caen en la misma columna, la estrategia está funcionando. Cuando A queda a la izquierda de D hay una brecha que debe cerrarse con acciones concretas de involucramiento, no solo con más correos.</div>'
      + '</section>';
  }

  return kpis + bloqueCom + bloqueMapa + bloqueInt + bloqueEval;
}

/* ============================ VISTA: FICHA ============================ */
function vistaFicha(){
  var ps = proyectosVisibles();
  if(!ps.length) return '<section class="card"><div class="card-b">'+vacio('Sin proyectos','Crea un proyecto para registrar su objetivo y su alcance.')+'</div></section>';
  return ps.map(function(p){
    var al = DB.alcance.filter(function(a){ return a.proyectoId===p.id; });
    var tabla = al.length
      ? '<div class="tw"><table><thead><tr><th style="width:190px">Dimensión</th><th style="width:210px">Alcance</th><th>Descripción</th>'+(readOnly?'':'<th class="no-print"></th>')+'</tr></thead><tbody>'
        + al.map(function(a){ var fuera = /fuera/i.test(a.dimension||'');
          return '<tr'+(fuera?' style="background:var(--risk-soft)"':'')+'><td class="t-strong">'+esc(a.dimension)+'</td><td>'+esc(a.alcance)+'</td><td>'+esc(a.descripcion)+'</td>'
            + (readOnly?'':'<td class="r no-print"><button class="btn btn-sm btn-ghost" data-act="edit-alcance" data-id="'+a.id+'">Editar</button></td>')+'</tr>'; }).join('')
        + '</tbody></table></div>'
      : vacio('Sin alcance registrado','Agrega las dimensiones del alcance para dejar por escrito qué entra y qué queda fuera.');
    var r = rangoProyecto(p);

      +   (p.notaAvance? '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:8px">Nota de avance</h3><p style="max-width:78ch;margin:0 0 18px">'+esc(p.notaAvance)+'</p>' : '')

/* ============================ VISTA: CRONOGRAMA ============================ */
var PXD = {dia:30, semana:11, mes:4};
function filasGantt(){
  var filas = [];
  proyectosVisibles().forEach(function(p){
    var fs = fasesDe(p.id);
    var ts = tareasDe(p.id);
    if(DB.proyectos.length>1 || UI.proy==='*'){
      var r = rangoProyecto(p);
      filas.push({tipo:'proy', id:p.id, nombre:(p.codigo?p.codigo+' · ':'')+p.nombre, ini:r.ini, fin:r.fin, avance:pct(p.avanceManual)});
    }
    fs.forEach(function(f){
      var tf = sortBy(ts.filter(function(t){return t.faseId===f.id;}), function(t){return (t.fechaInicio||'9999')+(t.fechaFin||'');});
      var ini=f.fechaInicio, fin=f.fechaFin;
      tf.forEach(function(t){ if(t.fechaInicio&&(!ini||t.fechaInicio<ini)) ini=t.fechaInicio; if(t.fechaFin&&(!fin||t.fechaFin>fin)) fin=t.fechaFin; });
      filas.push({tipo:'fase', id:f.id, nombre:f.nombre, ini:ini, fin:fin});
      tf.forEach(function(t){ filas.push({tipo:'tarea', id:t.id, t:t, nombre:t.nombre, ini:t.fechaInicio, fin:t.fechaFin}); });
    });
    var sf = sortBy(ts.filter(function(t){ return !t.faseId || !byId(DB.fases,t.faseId); }), function(t){return (t.fechaInicio||'9999');});
    if(sf.length){
      filas.push({tipo:'fase', id:'sf-'+p.id, nombre:'Sin fase asignada', ini:null, fin:null});
      sf.forEach(function(t){ filas.push({tipo:'tarea', id:t.id, t:t, nombre:t.nombre, ini:t.fechaInicio, fin:t.fechaFin}); });
    }
  });
  return filas;
}
function vistaCronograma(){
  var filas = filasGantt();
  var conFecha = filas.filter(function(f){ return f.ini && f.fin; });
  var controles = '<div class="card-b no-print"><div class="toolbar">'
    + '<label class="fld"><span>Escala</span><select data-ui="zoom">'
    + ['dia','semana','mes'].map(function(z){ return '<option value="'+z+'"'+(UI.zoom===z?' selected':'')+'>'+({dia:'Días',semana:'Semanas',mes:'Meses'})[z]+'</option>'; }).join('')
    + '</select></label>'
    + (readOnly?'':'<div class="grow"><button class="btn" data-act="nueva-fase">+ Fase</button> <button class="btn btn-primary" data-act="nueva-tarea">+ Tarea</button></div>')
    + '</div></div>';

  if(!conFecha.length){
    return '<section class="card"><div class="card-h"><h2>Cronograma</h2></div>'+controles
      + '<div class="card-b flush">'+vacio('Nada que graficar todavía','Agrega fases y tareas con fecha de inicio y fin para dibujar el Gantt.','<div style="margin-top:12px;display:flex;gap:10px;justify-content:center"><button class="btn" data-act="nueva-fase">Crear fase</button><button class="btn btn-primary" data-act="nueva-tarea">Crear tarea</button></div>')+'</div></section>';
  }

  var min=null,max=null;
  conFecha.forEach(function(f){ if(min===null||f.ini<min) min=f.ini; if(max===null||f.fin>max) max=f.fin; });
  if(HOY<min) min=HOY; if(HOY>max) max=HOY;
  min = addD(min,-3); max = addD(max,4);
  var d0 = dnum(min), total = dnum(max)-d0+1, px = PXD[UI.zoom]||11, W = Math.max(total*px, 600);
  function x(fecha){ return (dnum(fecha)-d0)*px; }

  /* --- encabezado: meses + marcas --- */
  var MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var MESC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var meses='', cur=new Date(pd(min)); cur=new Date(Date.UTC(cur.getUTCFullYear(),cur.getUTCMonth(),1));
  while(iso(cur)<=max){
    var ini = iso(cur)<min? min : iso(cur);
    var sig = new Date(Date.UTC(cur.getUTCFullYear(),cur.getUTCMonth()+1,1));
    var fin = iso(sig)>max? addD(max,1) : iso(sig);
    var w = (dnum(fin)-dnum(ini))*px;
    if(w>4) meses += '<div class="g-month" style="left:'+x(ini)+'px;width:'+w+'px">'+(w>66?MES[cur.getUTCMonth()]+' '+cur.getUTCFullYear():MESC[cur.getUTCMonth()]+' '+String(cur.getUTCFullYear()).slice(2))+'</div>';
    cur = sig;
  }
  var ticks='', grid='';
  if(UI.zoom==='dia'||UI.zoom==='semana'){
    var step = UI.zoom==='dia'?1:7;
    var start = min;
    if(step===7){ var dow=(new Date(pd(min)).getUTCDay()+6)%7; start = addD(min,-dow); if(start<min) start=addD(start,7); }
    for(var s=start; s<=max; s=addD(s,step)){
      var dt=new Date(pd(s)), we=(dt.getUTCDay()===0||dt.getUTCDay()===6);
      ticks += '<div class="g-tick'+(step===1&&we?' we':'')+'" style="left:'+x(s)+'px;width:'+(step*px)+'px">'+(step===1?dt.getUTCDate():dt.getUTCDate()+'/'+(dt.getUTCMonth()+1))+'</div>';
      grid  += '<div class="g-grid'+(step===1&&we?' we':'')+'" style="left:'+x(s)+'px;width:'+(step===1?px:0)+'px"></div>';
    }
  } else {
    var c2=new Date(pd(min)); c2=new Date(Date.UTC(c2.getUTCFullYear(),c2.getUTCMonth(),1));
    while(iso(c2)<=max){
      var i2 = iso(c2)<min?min:iso(c2);
      var n2 = new Date(Date.UTC(c2.getUTCFullYear(),c2.getUTCMonth()+1,1));
      var w2 = ((iso(n2)>max?dnum(addD(max,1)):dnum(iso(n2)))-dnum(i2))*px;
      ticks += '<div class="g-tick" style="left:'+x(i2)+'px;width:'+w2+'px">'+MESC[c2.getUTCMonth()]+'</div>';
      grid  += '<div class="g-grid" style="left:'+x(i2)+'px"></div>';
      c2=n2;
    }
  }

  /* --- filas --- */
  var H=32, idxTarea={}, izq='', der='';
  filas.forEach(function(f,i){
    if(f.tipo==='tarea') idxTarea[f.id]=i;
    var clase = f.tipo==='tarea'?'task':'phase';
    var meta = '';
    if(f.tipo==='tarea'){ meta = '<span class="t-sub mono" style="margin-left:auto;flex:none">'+(f.t.avance?pct(f.t.avance)+'%':'')+'</span>'; }
    izq += '<div class="g-row '+clase+'"'+(f.tipo==='proy'?' style="font-weight:700"':'')+'><span class="nm" title="'+esc(f.nombre)+'">'+(f.tipo==='tarea'&&f.t.esHito?'◆ ':'')+esc(f.nombre)+'</span>'+meta+'</div>';

    var barra_='';
    if(f.ini && f.fin){
      var L=x(f.ini), Wb=Math.max((dnum(f.fin)-dnum(f.ini)+1)*px, 3);
      if(f.tipo==='tarea' && f.t.esHito){
        barra_ = '<div class="g-ms" style="left:'+(L-7)+'px" title="'+esc(f.nombre)+' · '+fdate(f.ini)+'"></div>';
      } else if(f.tipo==='tarea'){
        var t=f.t, av=pct(t.avance), tarde = (t.estado!=='Completada' && t.fechaFin && t.fechaFin<HOY);
        var cl = t.estado==='Completada'?'done':(tarde?'late':'');
        barra_ = '<div class="g-bar '+cl+'" style="left:'+L+'px;width:'+Wb+'px" title="'+esc(t.nombre)+' · '+fdate(t.fechaInicio)+' → '+fdate(t.fechaFin)+' · '+av+'%">'
               + '<div class="g-fill" style="width:'+(100-av)+'%;margin-left:'+av+'%"></div></div>';
      } else {
        barra_ = '<div class="g-bar phase" style="left:'+L+'px;width:'+Wb+'px" title="'+esc(f.nombre)+'"></div>';
      }
    }
    der += '<div class="g-row '+clase+'">'+barra_+'</div>';
  });

  /* --- dependencias --- */
  var paths='';
  DB.tareas.forEach(function(t){
    if(!(t.id in idxTarea) || !t.predecesorasIds) return;
    t.predecesorasIds.forEach(function(pidT){
      var p = byId(DB.tareas,pidT);
      if(!p || !(p.id in idxTarea) || !p.fechaFin || !t.fechaInicio) return;
      var x1 = x(p.fechaFin)+ (p.esHito?7:(px)), y1 = idxTarea[p.id]*H + H/2;
      var x2 = x(t.fechaInicio) - (t.esHito?8:2), y2 = idxTarea[t.id]*H + H/2;
      var mx = Math.max(x1+9, x2-9);
      var mal = t.fechaInicio < p.fechaFin;
      paths += '<path d="M'+x1+' '+y1+' H'+mx+' V'+y2+' H'+x2+'" fill="none" stroke="'+(mal?'var(--risk)':'var(--line-strong)')+'" stroke-width="1.3"'+(mal?'':' stroke-dasharray="3 3"')+'/>'
             + '<path d="M'+x2+' '+y2+' l-5 -3.5 v7 z" fill="'+(mal?'var(--risk)':'var(--line-strong)')+'"/>';
    });
  });

  var altura = filas.length*H;
  var hoyX = x(HOY);
  var cuerpo = '<div class="gantt">'
    + '<div class="g-left"><div class="g-head">Actividad</div>'+izq+'</div>'
    + '<div class="g-right" data-hoy="'+Math.round(hoyX)+'"><div class="g-canvas" style="width:'+W+'px">'
    +   '<div class="g-head">'+meses+ticks+'</div>'
    +   '<div style="position:relative;height:'+altura+'px">'
    +     '<div style="position:absolute;inset:0">'+grid+'</div>'
    +     (hoyX>=0&&hoyX<=W?'<div class="g-today" style="left:'+hoyX+'px"></div>':'')
    +     '<svg class="g-dep" width="'+W+'" height="'+altura+'">'+paths+'</svg>'
    +     '<div style="position:relative">'+der+'</div>'
    +   '</div>'
    + '</div></div></div>';

  var leyenda = '<div class="g-legend no-print">'
    + '<span><i class="sw" style="background:var(--ink-2);opacity:.55"></i> Fase</span>'
    + '<span><i class="sw" style="background:var(--accent)"></i> Tarea (relleno = avance)</span>'
    + '<span><i class="sw" style="background:var(--ok)"></i> Completada</span>'
    + '<span><i class="sw" style="background:var(--risk)"></i> Vencida sin cerrar</span>'
    + '<span><i class="sw" style="background:var(--warn);transform:rotate(45deg);width:10px;height:10px"></i> Hito</span>'
    + '<span><i class="sw" style="background:var(--risk);width:2px;height:12px"></i> Hoy ('+fdate(HOY)+')</span>'
    + '<span>Flecha roja continua = la tarea arranca antes de que cierre su predecesora</span>'
    + '</div>';

  return '<section class="card"><div class="card-h"><h2>Cronograma</h2><span class="hint">'+fdateL(min)+' — '+fdateL(max)+'</span></div>'
    + controles + '<div class="card-b flush">'+cuerpo+'</div>'+leyenda+'</section>';
}

var modalActual = null;
function optsSel(lista, val, vacio){
  var o = vacio? '<option value="">'+esc(vacio)+'</option>' : '';
  lista.forEach(function(x){
    var v = typeof x==='string'? x : x.v, t = typeof x==='string'? x : x.t;
    o += '<option value="'+esc(v)+'"'+(String(val)===String(v)?' selected':'')+'>'+esc(t)+'</option>';
  });
  return o;
}
function campoHTML(c, val){
  var id='f_'+c.k, cls = c.full?' class="full"':'';
  var inner;
  if(c.tipo==='select') inner = '<select id="'+id+'">'+optsSel(c.opts, val, c.vacio)+'</select>';
  else if(c.tipo==='selectg'){
    var o = c.vacio? '<option value="">'+esc(c.vacio)+'</option>' : '';
    c.grupos.forEach(function(g){ o += '<optgroup label="'+esc(g.label)+'">'+optsSel(g.opts, val)+'</optgroup>'; });
    inner = '<select id="'+id+'">'+o+'</select>';
  }
  else if(c.tipo==='textarea') inner = '<textarea id="'+id+'" rows="3">'+esc(val==null?'':val)+'</textarea>';
  else if(c.tipo==='check') return '<div'+cls+'><label class="chkline"><input type="checkbox" id="'+id+'"'+(val?' checked':'')+'> '+esc(c.label)+'</label></div>';
  else if(c.tipo==='html') return '<div'+cls+'><span class="fld" style="display:block;margin-bottom:6px">'+esc(c.label)+'</span>'+c.html+'</div>';
  else if(c.tipo==='multi'){
    var arr = Array.isArray(val)?val:[];
    inner = '<div class="multi" id="'+id+'">'+(c.opts.length? c.opts.map(function(x){
      return '<label class="chkline"><input type="checkbox" value="'+esc(x.v)+'"'+(arr.indexOf(x.v)>=0?' checked':'')+'> '+esc(x.t)+'</label>';
    }).join('') : '<span class="t-sub">No hay opciones todavía.</span>')+'</div>';
  }
  else inner = '<input type="'+(c.tipo||'text')+'" id="'+id+'" value="'+esc(val==null?'':val)+'"'+(c.tipo==='number'?' step="'+(c.step||'1')+'" min="'+(c.min!=null?c.min:0)+'"':'')+'>';
  return '<label class="fld"'+cls+'><span>'+esc(c.label)+(c.req?' *':'')+'</span>'+inner+'</label>';
}
function abrirForm(spec){
  cerrarForm();
  var vals = spec.valores||{};
  var ovl = document.createElement('div'); ovl.className='ovl'; ovl.setAttribute('role','dialog'); ovl.setAttribute('aria-modal','true');
  ovl.innerHTML = '<div class="modal"><div class="card-h"><h2>'+esc(spec.titulo)+'</h2></div>'
    + '<div class="modal-b">'+spec.campos.map(function(c){ return campoHTML(c, vals[c.k]); }).join('')+'</div>'
    + '<div class="modal-f"><span class="err" id="f_err"></span>'
    + (spec.onEliminar?'<button class="btn btn-danger" data-f="del">Eliminar</button>':'')
    + '<button class="btn" data-f="cancel">Cancelar</button><button class="btn btn-primary" data-f="ok">Guardar</button></div></div>';
  document.body.appendChild(ovl);
  modalActual = ovl;
  var first = ovl.querySelector('input,select,textarea'); if(first) first.focus();
  ovl.addEventListener('click', function(ev){
    if(ev.target===ovl){ cerrarForm(); return; }
    var b = ev.target.closest('[data-f]'); if(!b) return;
    var f = b.getAttribute('data-f');
    if(f==='cancel'){ cerrarForm(); return; }
    if(f==='del'){ if(confirm('¿Eliminar definitivamente? Esta acción no se puede deshacer.')){ spec.onEliminar(); cerrarForm(); } return; }
    if(f==='ok'){
      var out={}, falta=null;
      spec.campos.forEach(function(c){
        if(c.tipo==='html') return;
        var el = ovl.querySelector('#f_'+c.k);
        var v;
        if(c.tipo==='check') v = el.checked;
        else if(c.tipo==='multi') v = Array.prototype.slice.call(el.querySelectorAll('input:checked')).map(function(i){return i.value;});
        else if(c.tipo==='number') v = el.value===''?null:Number(el.value);
        else v = el.value.trim();
        if(c.req && (v===''||v==null||(Array.isArray(v)&&!v.length))) falta = falta||c.label;
        out[c.k]=v;
      });
      if(falta){ ovl.querySelector('#f_err').textContent = 'Falta completar: '+falta; return; }
      var msg = spec.validar? spec.validar(out) : null;
      if(msg){ ovl.querySelector('#f_err').textContent = msg; return; }
      spec.onGuardar(out); cerrarForm();
    }
  });
  document.addEventListener('keydown', escHandler);
}
function escHandler(e){ if(e.key==='Escape') cerrarForm(); }
function cerrarForm(){ if(modalActual){ modalActual.remove(); modalActual=null; document.removeEventListener('keydown', escHandler); } }

function borrarProyecto(id){
  DB.proyectos = DB.proyectos.filter(function(x){return x.id!==id;});
  ['fases','tareas','entregables','asignaciones','costos','riesgos','alcance','interesados','comunicaciones','avances'].forEach(function(k){ DB[k]=DB[k].filter(function(x){return x.proyectoId!==id;}); });
  DB.tareas.forEach(function(t){ if(t.predecesorasIds) t.predecesorasIds = t.predecesorasIds.filter(function(pid){ return !!byId(DB.tareas,pid); }); });

    ],

    onEliminar: f? function(){ DB.fases=DB.fases.filter(function(x){return x.id!==f.id;}); DB.tareas.forEach(function(t){ if(t.faseId===f.id) t.faseId=''; }); guardar(); } : null
  });

function ciclo(idTarea, preds){
  var visto={}; var pila = (preds||[]).slice();
  while(pila.length){
    var cur = pila.pop();
    if(cur===idTarea) return true;
    if(visto[cur]) continue; visto[cur]=1;
    var t = byId(DB.tareas,cur);
    if(t && t.predecesorasIds) pila = pila.concat(t.predecesorasIds);
  }
  return false;
}

    ].concat(t? [{k:'_hist',label:'Historial de avances de esta tarea',tipo:'html',full:true,html:historialHTML(t.id)}] : []),
    validar:function(o){
      var e = valFechas(o,'fechaInicio','fechaFin'); if(e) return e;

      }

  });

  }).filter(function(g){ return g.opts.length; });
  var resp = t && t.responsableId ? nombreRec(t.responsableId) : '';

  abrirForm({ titulo:'Registrar avance',
    valores: { tareaId: t? t.id : '', fecha: hoyReal(), avanceNuevo: t? pct(t.avance) : 0, autor: resp },
    campos: [

    ].concat(t? [{k:'_hist',label:'Historial de esta tarea',tipo:'html',full:true,html:historialHTML(t.id)}] : []),
    validar:function(o){
      if(o.avanceNuevo>100) return 'El avance no puede superar el 100%.';
      if(!byId(DB.tareas,o.tareaId)) return 'Selecciona una tarea.';
      return null;
    },
    onGuardar:function(o){
      var tarea = byId(DB.tareas, o.tareaId);
      var d = registrarAvance(tarea, o.avanceNuevo, o.nota, o.autor, o.fecha);
      if(o.estadoAuto){
        if(tarea.avance>=100) tarea.estado='Completada';

        else tarea.estado='Pendiente';
      }
      UI.tab='bitacora';
      guardar();
      toast(d>0? 'Avance registrado: +'+d+' puntos.' : (d<0? 'Avance corregido: '+d+' puntos.' : 'Nota registrada, sin cambio de porcentaje.'));
    }
  });
  /* la casilla de estado viene marcada: es lo que casi siempre se quiere */
  var chk = document.querySelector('#f_estadoAuto'); if(chk) chk.checked = true;
}
function formEditAvance(a){

function csvCell(v){ v = v==null?'':String(v); return '"'+v.replace(/"/g,'""')+'"'; }
function csvDoc(cab, filas){ return '﻿'+[cab].concat(filas).map(function(f){ return f.map(csvCell).join(';'); }).join('\r\n'); }
function armarCSV(k){
  var ids = idsVisibles();
  if(k==='portafolio') return csvDoc(['Codigo','Proyecto','Cliente','Gerente','Estado','Inicio','Fin','Avance %','Presupuesto COP','Ejecutado COP','Nota de avance'],
    proyectosVisibles().map(function(p){ var r=rangoProyecto(p); return [p.codigo,p.nombre,p.cliente,p.gerente,p.estado,fdate(r.ini),fdate(r.fin),pct(p.avanceManual),Number(p.presupuestoCOP)||0,costoEjecutado(p.id),p.notaAvance]; }));
  if(k==='tareas') return csvDoc(['Proyecto','Fase','Tarea','Hito','Responsable','Inicio','Fin','Dias','Avance %','Estado','Predecesoras'],
    DB.tareas.filter(function(t){return ids.indexOf(t.proyectoId)>=0;}).map(function(t){ var f=byId(DB.fases,t.faseId);
      return [codProy(t.proyectoId), f?f.nombre:'', t.nombre, t.esHito?'Si':'No', nombreRec(t.responsableId), fdate(t.fechaInicio), fdate(t.fechaFin),
        (t.fechaInicio&&t.fechaFin)?(diasEntre(t.fechaInicio,t.fechaFin)+1):'', pct(t.avance), t.estado||'Pendiente',
        (t.predecesorasIds||[]).map(function(i){var x=byId(DB.tareas,i);return x?x.nombre:'';}).join(' | ')]; }));
  if(k==='entregables') return csvDoc(['Proyecto','Entregable','De que trata','Fase','Responsable','Fecha comprometida','Avance %','Avance calculado tareas','Estado','Evidencia','Observaciones'],
    DB.entregables.filter(function(e){return ids.indexOf(e.proyectoId)>=0;}).map(function(e){ var f=byId(DB.fases,e.faseId), c=avanceCalcEntregable(e);
      return [codProy(e.proyectoId),e.nombre,e.descripcion,f?f.nombre:'',nombreRec(e.responsableId),fdate(e.fechaComprometida),pct(e.avance),c?c.v:'',e.estado||'Pendiente',e.evidencia,e.observaciones]; }));
  if(k==='recursos') return csvDoc(['Persona','Rol','Area','Costo hora COP','Proyecto','% Dedicacion','Desde','Hasta'],

      return [codProy(i.proyectoId),i.nombre,i.rol,i.organizacion,i.categoria,i.poder,i.interes,q?q.t:'',i.posturaActual,i.posturaDeseada,

  if(k==='costos') return csvDoc(['Proyecto','Fecha','Concepto','Tipo','Estado','Monto COP'],
