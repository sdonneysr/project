/* ============================ INFORME EJECUTIVO EN PDF ============================ */
/* window.print() no responde cuando el tablero corre embebido en un marco restringido,
   así que el informe se arma como PDF y se entrega por la capacidad de descargas. */
var jsPDFready = null;
function cargarJsPDF(){
  if(jsPDFready) return jsPDFready;
  jsPDFready = new Promise(function(res, rej){
    if(window.jspdf && window.jspdf.jsPDF) return res(window.jspdf.jsPDF);
    var sc = document.createElement('script');
    sc.src = window.__JSPDF_SRC__ || 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    sc.onload = function(){ (window.jspdf && window.jspdf.jsPDF) ? res(window.jspdf.jsPDF) : rej(new Error('lib')); };
    sc.onerror = function(){ jsPDFready = null; rej(new Error('red')); };
    document.head.appendChild(sc);
  });
  return jsPDFready;
}
/* Las fuentes estándar de PDF sólo cubren Latin-1: se normaliza lo que no entra. */
function pdfTxt(v){
  return String(v==null?'':v)
    .replace(/[\u2192\u2190\u2014\u2013\u2012\u2011]/g,'-')
    .replace(/[\u2191\u2193]/g,'')
    .replace(/[\u25c6\u25c7\u25cf\u2022]/g,'*')
    .replace(/\u2713/g,'OK')
    .replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"')
    .replace(/[\u00a0\u202f\u2028\u2029]/g,' ')
    .replace(/\u2026/g,'...')
    .replace(/[^\x00-\xff]/g,'');
}
function generarPDF(){
  if(!downloadsNS){ toast('Las descargas no están disponibles en esta vista. Abre el tablero en su propia pestaña e imprime desde el navegador.', 6000); return; }
  toast('Armando el informe…');
  cargarJsPDF().then(function(jsPDF){
    var doc = new jsPDF({unit:'mm', format:'a4'});
    var M=14, W=210, y=0, pag=1;
    var G={ink:[22,25,38], mid:[90,97,115], soft:[140,146,163], line:[205,210,222], band:[241,243,248]};
    function setC(c){ doc.setTextColor(c[0],c[1],c[2]); }
    function pie(){
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); setC(G.soft);
      doc.text(pdfTxt('Control de Portafolio · generado el '+fdateL(HOY)), M, 288);
      doc.text('Pág. '+pag, W-M, 288, {align:'right'});
    }
    function nueva(){ pie(); doc.addPage(); pag++; y=M+4; }
    function espacio(h){ if(y+h > 278){ nueva(); } }
    function h2(t){
      espacio(14); y+=4;
      doc.setFont('helvetica','bold'); doc.setFontSize(10.5); setC(G.ink);
      doc.text(pdfTxt(t), M, y); y+=2.2;
      doc.setDrawColor(G.ink[0],G.ink[1],G.ink[2]); doc.setLineWidth(.5);
      doc.line(M, y, W-M, y); y+=5.5;
    }
    function parrafo(t, size){
      doc.setFont('helvetica','normal'); doc.setFontSize(size||8.6); setC(G.mid);
      var ls = doc.splitTextToSize(pdfTxt(t), W-2*M);
      ls.forEach(function(l){ espacio(5); doc.text(l, M, y); y+=4.1; });
      y+=1.5;
    }
    /* tabla: cols=[{t,w,a}] filas=[[celda,...]] */
    function tabla(cols, filas){
      var xs=[], acc=M; cols.forEach(function(c){ xs.push(acc); acc+=c.w; });
      function cabecera(){
        espacio(10);
        doc.setFillColor(G.band[0],G.band[1],G.band[2]);
        doc.rect(M, y-3.6, W-2*M, 6.4, 'F');
        doc.setFont('helvetica','bold'); doc.setFontSize(7); setC(G.mid);
        cols.forEach(function(c,i){
          var x = c.a==='r'? xs[i]+c.w-1.5 : xs[i]+1.5;
          doc.text(pdfTxt(c.t.toUpperCase()), x, y, {align: c.a==='r'?'right':'left'});
        });
        y+=4.4;
      }
      cabecera();
      filas.forEach(function(f){
        var partes = cols.map(function(c,i){
          doc.setFont('helvetica', c.b?'bold':'normal'); doc.setFontSize(8.2);
          return doc.splitTextToSize(pdfTxt(f[i]), c.w-3);
        });
        var alto = Math.max.apply(null, partes.map(function(pp){return pp.length;}))*3.9 + 3.2;
        if(y+alto > 278){ nueva(); cabecera(); }
        cols.forEach(function(c,i){
          doc.setFont('helvetica', c.b?'bold':'normal'); doc.setFontSize(8.2);
          setC(c.b? G.ink : G.mid);
          var x = c.a==='r'? xs[i]+c.w-1.5 : xs[i]+1.5;
          partes[i].forEach(function(l,k){ doc.text(l, x, y+2.6+k*3.9, {align: c.a==='r'?'right':'left'}); });
        });
        y+=alto;
        doc.setDrawColor(G.line[0],G.line[1],G.line[2]); doc.setLineWidth(.2);
        doc.line(M, y-1.4, W-M, y-1.4);
      });
      y+=2;
    }

    /* ---------- portada / encabezado ---------- */
    var ps = proyectosVisibles(), ids = idsVisibles();
    y = M+6;
    doc.setFont('helvetica','bold'); doc.setFontSize(17); setC(G.ink);
    doc.text('Informe ejecutivo de portafolio', M, y); y+=6.5;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); setC(G.soft);
    doc.text(pdfTxt('Corte al '+fdateL(HOY)+(UI.proy!=='*'? '  ·  '+nombreProy(UI.proy) : '  ·  '+ps.length+' proyecto'+(ps.length===1?'':'s'))), M, y); y+=4;
    doc.setDrawColor(G.ink[0],G.ink[1],G.ink[2]); doc.setLineWidth(.8); doc.line(M, y, W-M, y); y+=8;

    /* ---------- KPIs ---------- */
    var presu=0, ejec=0, sumAv=0, pesos=0;
    ps.forEach(function(p){ presu += Number(p.presupuestoCOP)||0; ejec += costoEjecutado(p.id);
      var w=(Number(p.presupuestoCOP)||0)||1; if(p.estado!=='Cerrado'){ sumAv+=pct(p.avanceManual)*w; pesos+=w; } });
    var avgAv = pesos? Math.round(sumAv/pesos) : 0;
    var ents = DB.entregables.filter(function(e){ return ids.indexOf(e.proyectoId)>=0; });
    var prox30 = ents.filter(function(e){ var d=diasEntre(HOY,e.fechaComprometida); return entAbierto(e)&&d!=null&&d>=0&&d<=30; });
    var riesgosAb = DB.riesgos.filter(function(r){ return ids.indexOf(r.proyectoId)>=0 && r.estado!=='Cerrado' && r.estado!=='Mitigado'; });
    var K = [
      ['Proyectos activos', String(ps.filter(function(p){return p.estado!=='Cerrado';}).length)],
      ['Avance promedio', avgAv+'%'],
      ['Entregables a 30 días', String(prox30.length)],
      ['Riesgos abiertos', String(riesgosAb.length)]
    ];
    var kw=(W-2*M-3*3)/4;
    K.forEach(function(k,i){
      var x=M+i*(kw+3);
      doc.setFillColor(G.band[0],G.band[1],G.band[2]); doc.rect(x, y, kw, 16, 'F');
      doc.setFont('helvetica','normal'); doc.setFontSize(6.6); setC(G.soft);
      doc.text(pdfTxt(k[0].toUpperCase()), x+2.5, y+5);
      doc.setFont('helvetica','bold'); doc.setFontSize(14); setC(G.ink);
      doc.text(pdfTxt(k[1]), x+2.5, y+13);
    });
    y+=22;

    /* ---------- portafolio ---------- */
    h2('Portafolio');
    if(ps.length){
      tabla([{t:'Proyecto',w:58,b:true},{t:'Estado',w:24},{t:'Avance',w:16,a:'r'},{t:'Ventana',w:38},{t:'Presupuesto',w:22,a:'r'},{t:'Ejecutado',w:24,a:'r'}],
        ps.map(function(p){ var r=rangoProyecto(p), pre=Number(p.presupuestoCOP)||0, eje=costoEjecutado(p.id);
          var etq = p.nombre;
          if(p.codigo && p.nombre.toUpperCase().indexOf(p.codigo.toUpperCase())<0) etq = p.codigo+' - '+p.nombre;
          return [ etq, p.estado||'Planeado', pct(p.avanceManual)+'%',
                   fdate(r.ini)+' a '+fdate(r.fin), pre?moneyK(pre):'-', eje?moneyK(eje):'-' ]; }));
    } else parrafo('Sin proyectos en el filtro actual.');

    /* ---------- entregables ---------- */
    var fs2=finSemana(), fm2=finMes();
    var abiertas = ents.filter(function(e){ return entAbierto(e) && e.fechaComprometida; });
    var sem = sortBy(abiertas.filter(function(e){ return e.fechaComprometida<=fs2; }), function(e){return e.fechaComprometida;});
    var mes = sortBy(abiertas.filter(function(e){ return e.fechaComprometida>fs2 && e.fechaComprometida<=fm2; }), function(e){return e.fechaComprometida;});
    h2('Entregas comprometidas');
    parrafo('Esta semana, hasta el '+fdate(fs2)+': '+(sem.length?sem.length+' entregable'+(sem.length===1?'':'s'):'nada comprometido')
      +'.  Resto del mes, hasta el '+fdate(fm2)+': '+(mes.length?mes.length+' entregable'+(mes.length===1?'':'s'):'nada comprometido')+'.');
    var listaEnt = sem.concat(mes);
    if(listaEnt.length){
      tabla([{t:'Fecha',w:20},{t:'Entregable',w:66,b:true},{t:'Proyecto',w:24},{t:'Responsable',w:30},{t:'Avance',w:14,a:'r'},{t:'Estado',w:28}],
        listaEnt.map(function(e){ return [fdate(e.fechaComprometida), e.nombre, codProy(e.proyectoId),
          nombreRec(e.responsableId), pct(e.avance)+'%', e.estado||'Pendiente']; }));
    }

    /* ---------- bitácora de la semana ---------- */
    var semIni = inicioSemana(HOY), semFin = addD(semIni, 6);
    var avSem = sortBy(DB.avances.filter(function(a){
      return ids.indexOf(a.proyectoId)>=0 && a.fecha>=semIni && a.fecha<=semFin;
    }), function(a){ return (a.fecha||'')+(a.ts||''); });
    h2('Avances de la semana');
    var pts = avSem.reduce(function(acc,a){ return acc+(Number(a.delta)||0); }, 0);
    parrafo(etiquetaSemana(semIni) + '.  ' + (avSem.length
      ? avSem.length+' registro'+(avSem.length===1?'':'s')+', '+(pts>0?'+':'')+pts+' puntos de avance.'
      : 'Sin avances reportados en la semana.'));
    if(avSem.length){
      tabla([{t:'Fecha',w:20},{t:'Tarea',w:60,b:true},{t:'Avance',w:24},{t:'Reporta',w:24},{t:'Nota',w:54}],
        avSem.map(function(a){ var t=byId(DB.tareas,a.tareaId);
          return [fdate(a.fecha), t? t.nombre : '(tarea eliminada)',
                  a.avanceAnterior+'% a '+a.avanceNuevo+'% ('+(a.delta>0?'+':'')+a.delta+')',
                  a.autor||'-', a.nota||'-']; }));
    }

    /* ---------- avance por entregable del proyecto único ---------- */
    if(UI.proy!=='*' && ents.length){
      h2('Avance por entregable');
      tabla([{t:'Entregable',w:70,b:true},{t:'Fecha',w:22},{t:'Avance',w:16,a:'r'},{t:'Estado',w:28},{t:'Evidencia',w:46}],
        sortBy(ents,function(e){return e.fechaComprometida||'9999';}).map(function(e){
          return [e.nombre, fdate(e.fechaComprometida), pct(e.avance)+'%', e.estado||'Pendiente',
                  (e.evidencia||'').replace(/^https?:\/\//i,'') || '-']; }));
    }

    /* ---------- riesgos ---------- */
    h2('Riesgos abiertos');
    if(riesgosAb.length){
      tabla([{t:'Riesgo',w:52,b:true},{t:'Nivel',w:18},{t:'Plan de contingencia',w:66},{t:'Responsable',w:26},{t:'Estado',w:20}],
        riesgosAb.slice().sort(function(a,b){return nivelRiesgo(b).v-nivelRiesgo(a).v;}).map(function(r){
          return [r.nombre, nivelRiesgo(r).t, r.planContingencia||'-', nombreRec(r.responsableId), r.estado||'Abierto']; }));
    } else parrafo('Sin riesgos abiertos registrados.');

    /* ---------- objetivo del proyecto único ---------- */
    if(UI.proy!=='*'){
      var pp = byId(DB.proyectos, UI.proy);
      if(pp && (pp.descripcion||pp.notaAvance)){
        h2('Objetivo y nota de avance');
        if(pp.descripcion) parrafo(pp.descripcion);
        if(pp.notaAvance) parrafo('Nota de avance: '+pp.notaAvance);
      }
    }
    pie();

    var nombre = 'informe-ejecutivo-'+(UI.proy!=='*'? (codProy(UI.proy).replace(/[^\w-]+/g,'-')+'-') : '')+HOY;
    var buf = doc.output('arraybuffer');
    return downloadsNS.save({filename: nombre+'.pdf', data: buf})
      .then(function(){ toast('Informe entregado.'); })
      ['catch'](function(err){
        var c = err && err.code;
        if(c==='declined') return;
        if(c==='extension_not_enabled'||c==='rejected_extension'){
          toast('Este visor no permite descargar PDF. Abre el tablero en su propia pestaña e imprime desde el navegador.', 7000); return;
        }
        if(c==='too_large'){ toast('El informe quedó demasiado grande. Filtra por un solo proyecto y vuelve a intentarlo.', 6000); return; }
        if(c==='rate_limited'){ toast('Espera unos segundos antes de generar otro archivo.', 5000); return; }
        toast('No se pudo entregar el informe.', 5000);
      });
  })['catch'](function(err){
    if(err && err.message==='red') toast('No se pudo cargar el generador de PDF (sin conexión al CDN). Abre el tablero en su propia pestaña e imprime desde el navegador.', 7000);
    else toast('No se pudo generar el informe.', 5000);
  });
}

  E(p1,f11,'Documento de requerimientos',lf,d(-38),'Aprobado','Alcance funcional acordado con el cliente.');
  E(p1,f12,'Cotizador en producción',dev1,d(52),'Pendiente','Hito comercial del trimestre.');
  E(p1,f13,'Informe de la ventana de cambio',ops,d(5),'Entregado','Bitácora del despliegue y plan de reversión.');
  A(gp,p1,30); A(lf,p1,40); A(dev1,p1,80); A(ops,p1,50); A(qa,p1,40);
  C(p1,'Equipo de desarrollo — mes en curso','Personal',48000000,d(-5),'Ejecutado');
  C(p1,'Equipo de desarrollo — mes anterior','Personal',46000000,d(-35),'Ejecutado');
  C(p1,'Licencias','Licencia',9800000,d(-20),'Ejecutado');
  C(p1,'Infraestructura en nube','Infraestructura',6200000,d(1),'Planeado');
  G(p1,'Disponibilidad del ambiente de pruebas','Infraestructura','Media','Alto','Ambiente alterno y ventana de contingencia acordada.');

  /* --- Proyecto de ejemplo B --- */
  var p2 = P({nombre:'Plan de continuidad del ERP', codigo:'DEMO-02', cliente:'Cliente de ejemplo',
    gerente:'Gerente de proyecto', estado:'En riesgo', fechaInicio:d(-40), fechaFin:d(60), avanceManual:35,
    notaAvance:'Datos de demostración. La ventana de pruebas depende de disponibilidad del cliente.',
    presupuestoCOP:180000000, descripcion:'Proyecto ficticio con una fase bloqueada, para ver los semáforos y las alertas.'});
  var f21 = F(p2,'Levantamiento',1,d(-40),d(-15));
  var f22 = F(p2,'Documentación',2,d(-14),d(20));
  var f23 = F(p2,'Pruebas',3,d(21),d(60));
  var t21 = T(p2,f21,'Alineación del alcance',lf,d(-40),d(-28),100,'Completada');
  var t23 = T(p2,f22,'Redacción del plan',lf,d(-14),d(12),60,'En curso',[t21]);
  T(p2,f22,'Matriz de procesos críticos',lf,d(-8),d(18),40,'En curso',[t21]);
  T(p2,f22,'Definición de RTO y RPO',ops,d(-3),d(9),25,'Bloqueada',[t21]);
  var t26 = T(p2,f23,'Simulacro de recuperación',ops,d(24),d(24),0,'Pendiente',[t23],true);
  T(p2,f23,'Informe de resultados',qa,d(25),d(45),0,'Pendiente',[t26]);
  E(p2,f22,'Plan de continuidad del negocio',lf,d(12),'En curso','Versión 1 en revisión interna.');
  E(p2,f23,'Informe de pruebas de continuidad',qa,d(45),'Pendiente','Resultados del simulacro y acciones correctivas.');
  A(gp,p2,25); A(lf,p2,40); A(dev1,p2,20); A(ops,p2,25); A(qa,p2,30);
  C(p2,'Equipo funcional — mes en curso','Personal',19500000,d(-5),'Ejecutado');
  C(p2,'Consultoría externa','Proveedor',24000000,d(20),'Planeado');
  G(p2,'Disponibilidad de los interesados','Stakeholders','Alta','Alto','Plan de comunicación y comité de escalamiento.');

  /* bitacora: unas semanas de historial para que la trazabilidad se vea con datos */
  function AV(tarea, semanasAtras, deAv, aAv, nota, autor){
    DB.avances.push({ id:uid('av'), proyectoId:tarea.proyectoId, tareaId:tarea.id,
      fecha: addD(inicioSemana(HOY), -7*semanasAtras + 3), ts:'',
      avanceAnterior:deAv, avanceNuevo:aAv, delta:aAv-deAv, nota:nota, autor:autor||'' });
  }
  var bt = function(nombre){ return DB.tareas.filter(function(x){ return x.nombre===nombre; })[0]; };
  var tCot = bt('Cotizador en línea'), tAcc = bt('Accesibilidad del portal'),
      tMic = bt('Despliegue del micrositio'), tPlan = bt('Redacción del plan');
  if(tCot){ AV(tCot,1,0,5,'Arranque: modelo de datos y esqueleto del formulario.','Desarrollador senior');
            AV(tCot,0,5,10,'Integración con el catálogo de productos; falta el cálculo de tarifas.','Desarrollador senior'); }
  if(tAcc){ AV(tAcc,3,0,15,'Auditoría inicial: 42 hallazgos clasificados por severidad.','Desarrollador senior');
            AV(tAcc,2,15,25,'Corregidos los de contraste y foco de teclado.','Desarrollador senior');
            AV(tAcc,0,25,35,'Formularios con etiquetas y mensajes de error accesibles.','Desarrollador senior'); }
  if(tMic){ AV(tMic,2,0,50,'Infraestructura aprovisionada y dominio configurado.','Ingeniero de infraestructura');
            AV(tMic,0,50,80,'Despliegue en ambiente de pruebas; pendiente el certificado de producción.','Ingeniero de infraestructura'); }
  if(tPlan){ AV(tPlan,2,0,40,'Procesos críticos levantados con las áreas.','Líder funcional');
             AV(tPlan,1,40,60,'Redactadas las estrategias de recuperación.','Líder funcional');
             AV(tPlan,0,60,60,'Sin avance esta semana: pendiente la validación del cliente.','Líder funcional'); }

  /* el avance de cada entregable se deja cuadrado con el promedio de las tareas de su fase */
  DB.entregables.forEach(function(e){ var c=avanceCalcEntregable(e); if(c) e.avance=c.v; });

  UI.tab='resumen'; UI.proy='*';
  guardar();
}

/* ============================ EVENTOS ============================ */
document.addEventListener('click', function(ev){
  var tab = ev.target.closest('[data-tab]');
  if(tab){ UI.tab = tab.getAttribute('data-tab'); saveUI(); render(); window.scrollTo(0,0); return; }
  var b = ev.target.closest('[data-act]');
  if(!b || b.closest('.ovl')) return;
  var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
  switch(act){
    case 'imprimir':
      try{ window.print(); }catch(e){ toast('El navegador no permitió abrir el diálogo de impresión. Usa Descargar PDF.', 6000); }
      break;
    case 'pdf': generarPDF(); break;
    case 'export': exportar(b.getAttribute('data-k')); break;
    case 'nuevo-proyecto': formProyecto(null); break;
    case 'edit-proyecto': formProyecto(byId(DB.proyectos,id)); break;
    case 'del-proyecto': if(confirm('Se eliminará el proyecto y todo lo asociado (fases, tareas, entregables, asignaciones y costos). ¿Continuar?')) borrarProyecto(id); break;
    case 'nueva-fase': formFase(null); break;
    case 'nueva-tarea': formTarea(null); break;
    case 'nuevo-avance': formAvance(null); break;
    case 'avance-tarea': formAvance(byId(DB.tareas,id)); break;
    case 'edit-avance': formEditAvance(byId(DB.avances,id)); break;
    case 'edit-tarea': formTarea(byId(DB.tareas,id)); break;
    case 'nuevo-entregable': formEntregable(null); break;
    case 'ajustar-avances': {
      var n=0;
      DB.entregables.forEach(function(e){ var c=desajusteEntregable(e); if(c){ e.avance=c.v; n++; } });
      if(n){ guardar(); toast('Se ajustó el avance de '+n+' entregable'+(n===1?'':'s')+'.'); }
      break; }
    case 'edit-entregable': formEntregable(byId(DB.entregables,id)); break;
    case 'nuevo-recurso': formRecurso(null); break;
    case 'edit-recurso': formRecurso(byId(DB.recursos,id)); break;
    case 'nueva-asignacion': formAsignacion(null); break;
    case 'nuevo-costo': formCosto(null); break;
    case 'nuevo-riesgo': formRiesgo(null); break;
    case 'edit-riesgo': formRiesgo(byId(DB.riesgos,id)); break;
    case 'nuevo-alcance': formAlcance(null, id); break;
    case 'nueva-com': formCom(null); break;
    case 'edit-com': formCom(byId(DB.comunicaciones,id)); break;
    case 'nuevo-interesado': formInteresado(null); break;
    case 'edit-interesado': formInteresado(byId(DB.interesados,id)); break;
    case 'plan-base':
      if(DB.comunicaciones.length && !confirm('Ya hay comunicaciones registradas. El plan base se agregará junto a lo existente. ¿Continuar?')) break;
      cargarPlanComunicaciones(); break;
    case 'edit-alcance': formAlcance(byId(DB.alcance,id)); break;
    case 'edit-costo': formCosto(byId(DB.costos,id)); break;
    case 'ejemplo':
      if(DB.proyectos.length && !confirm('Ya hay proyectos cargados. La estructura de referencia se agregará junto a lo existente. ¿Continuar?')) break;
      cargarEjemplo(); break;
    case 'borrar-todo':
      if(confirm('Se borrará TODO el contenido del tablero de forma permanente. ¿Continuar?')){
        DB = {v:4,proyectos:[],fases:[],tareas:[],entregables:[],recursos:[],asignaciones:[],costos:[],riesgos:[],alcance:[],interesados:[],comunicaciones:[],avances:[]};
        UI.proy='*'; guardar();
      } break;
  }
});
document.addEventListener('change', function(ev){
  var el = ev.target.closest('[data-ui]');
  if(!el || el.closest('.ovl')) return;
  UI[el.getAttribute('data-ui')] = el.value;
  saveUI(); render();
});

/* ============================ RENDER ============================ */
function vistaActual(){
  switch(UI.tab){
    case 'cronograma': return vistaCronograma();
    case 'entregables': return vistaEntregables();
    case 'tareas': return vistaTareas();
    case 'riesgos': return vistaRiesgos();
    case 'bitacora': return vistaBitacora();
    case 'comunicaciones': return vistaComunicaciones();
    case 'ficha': return vistaFicha();
    case 'recursos': return vistaRecursos();
    case 'datos': return vistaDatos();
    default: return vistaResumen();
  }
}
function render(){
  var sx = window.scrollX, sy = window.scrollY;
  root.innerHTML = shell(vistaActual());
  root.removeAttribute('aria-busy');
  var gr = root.querySelector('.g-right[data-hoy]');
  if(gr){ gr.scrollLeft = Math.max(0, Number(gr.getAttribute('data-hoy')) - gr.clientWidth*0.32); }
  window.scrollTo(sx, sy);
}

/* ============================ ARRANQUE ============================ */
render();
if(window.claude && typeof window.claude.use==='function'){
  window.claude.use('artifact').then(function(ns){
    artifactNS = ns;
    if(!ns){ readOnly = true; render(); }
  })['catch'](function(){ readOnly = true; render(); });
  window.claude.use('downloads').then(function(ns){ downloadsNS = ns; })['catch'](function(){});
} else {
  readOnly = true; render();
}
})();
</script>
